# M1: Workspace skeleton only — all crate members are placeholders.
# Real dependencies land in M2+ when implementation begins.

[workspace]
resolver = "2"
members = [
  "crates/notedthat-core",
  "crates/notedthat-storage-s3",
  "crates/notedthat-storage-fs",
  "crates/notedthat-indexer",
  "crates/notedthat-write",
  "crates/notedthat-events",
  "crates/notedthat-api-http",
  "crates/notedthat-webdav",
  "crates/notedthat-mcp",
  "crates/notedthat-server",
  "crates/notedthat",
]

[workspace.package]
version = "0.11.0"
edition = "2024"

# Derived, not chosen: the maximum `rust-version` across the resolved dependency
# graph — today the aws-sdk-s3 / aws-smithy-* family. Verified rather than
# asserted: 1.90.0 is refused by Cargo naming those crates, 1.91.1 builds and
# tests the whole workspace, and ci.yml's `test` matrix runs the suite on this
# exact toolchain so a dependency that raises the floor fails CI instead of
# shipping a manifest that lies to consumers. Edition 2024's own floor (1.85)
# stopped being the binding constraint some time ago.
#
# A fact about today's tree, not a support promise — it may rise in any release,
# and the CHANGELOG entry for the dependency bump is where that is said.
#
# Note this does NOT change resolution: MSRV-aware resolution is a resolver 3
# feature and this workspace is on resolver 2, so declaring it only adds the
# compile-time check. That is deliberate. Under resolver 3 Cargo would silently
# hold a dependency back to an MSRV-compatible version, which for a project that
# ships signed images is the worse failure — a declined security update that
# looks like no update at all. Keep resolver 2 and let CI be the tripwire.
rust-version = "1.91.1"
license = "MPL-2.0"
repository = "https://github.com/NotedThat/NotedThat"
homepage = "https://github.com/NotedThat/NotedThat"
authors = ["NotedThat Contributors"]

# Populated in M2. Features left minimal here; crates opt into features they need.
[workspace.dependencies]
# Workspace crates
notedthat-core = { path = "crates/notedthat-core", version = "0.11.0" }
notedthat-api-http = { path = "crates/notedthat-api-http", version = "0.11.0" }
notedthat-indexer = { path = "crates/notedthat-indexer", version = "0.11.0" }
notedthat-write = { path = "crates/notedthat-write", version = "0.11.0" }
notedthat-events = { path = "crates/notedthat-events", version = "0.11.0" }

# MCP
rmcp = { version = "2.1.0", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
schemars = { version = "1.2", features = ["derive"] }
percent-encoding = "2"
url = "2"

# Command-line interface. Every setting is reachable as a flag as well as an
# environment variable, and `env = "..."` on an arg is what makes the flag win.
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# Async runtime & primitives
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1.89"
bytes = "1.12"
futures = "0.3"
tempfile = "3"
pulldown-cmark = { version = "0.13", default-features = false }

# HTTP layer
axum = { version = "0.8", default-features = false }
axum-extra = { version = "0.10", features = ["typed-header"] }
base64 = "0.22"
dav-server = { version = "0.11", default-features = false }
headers = "0.4"
hex = "0.4"
httpdate = "1.0"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", default-features = false }
http = "1"

# S3
aws-sdk-s3 = { version = "1.137", default-features = false, features = ["rt-tokio", "http-1x", "default-https-client"] }
aws-config = { version = "1.1", default-features = false, features = ["behavior-version-latest"] }
aws-smithy-runtime-api = "1"

# Event log broker (JetStream)
async-nats = "0.50"

# Vector DB
qdrant-client = { version = "1.15", default-features = false, features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
# Metrics (D69). The instrumented crates take only the facade: its macros are a
# no-op until a recorder is installed, so nothing here reaches a crate's public
# API and every unit test keeps running without an exporter. The exporter itself
# is `notedthat-server`'s alone.
metrics = "0.24"
# `default = ["http-listener", "push-gateway"]`, and both are unwanted. The
# exposition is served by our own axum route on the metrics listener, so the
# exporter's `hyper` server earns nothing; and nothing here pushes. Off, the
# exporter adds no HTTP or TLS stack of its own — the seventeen crates it does
# bring are its histogram and concurrent-map machinery.
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# Errors
thiserror = "2.0"
anyhow = "1"

# Text processing
text-splitter = { version = "0.32", features = ["markdown"] }

# Security & IDs
subtle = "2.4"
# OIDC bearer verification: RS*/ES* over a JWKS. Version 9 uses `ring`, which is
# already in the tree through rustls, so no second crypto backend is compiled.
jsonwebtoken = "9"
sha2 = "0.10"
uuid = { version = "1.6", default-features = false, features = ["v7"] }

# Testing
testcontainers = "0.27"
wiremock = "0.6"

# cargo-dist configuration — drives .github/workflows/release.yml.
# Only crates that opt in via [package.metadata.dist] dist = true are packaged
# (currently: notedthat, which owns the published `notedthat-server` binary).
# Everything else is a library crate and stays library-only.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
allow-dirty = ["ci"]
ci = ["github"]
#
# Windows targets are temporarily removed. `aarch64-pc-windows-msvc` failed
# every release, and because the installers, signing and upload all wait on the
# full matrix, that one target left v0.1.6, v0.2.0 and v0.3.0 with no binaries
# attached at all.
#
# The blocker is `ring`'s C build under cargo-xwin, not anything in this repo:
# clang receives cargo-xwin's MSVC-style `/imsvc` include flags as bare
# arguments and fails with "no such file or directory: '/imsvc'". A toolchain
# bump does not help — v0.3.0 built with rustc 1.98.1 and still failed here.
# Note `x86_64-pc-windows-msvc` does build; it is dropped only to keep Windows
# support all-or-nothing rather than shipping one arch.
#
# To restore, add the `*-pc-windows-msvc` triples back alongside "powershell"
# in `installers`; `windows-archive` is kept below for that. Linux and macOS
# are unaffected, and Windows users can still `cargo install notedthat`.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
installers = ["shell"]
# Unused while the Windows targets are out; retained so restoring them is a
# one-line change.
windows-archive = ".zip"
unix-archive = ".tar.xz"
checksum = "sha256"
build-local-artifacts = true
publish-prereleases = false
announce-in-tag = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Groups at priority -1 so individual allows (priority 0) override them.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# --- Selective allows: pedantic group ---
# Reason: Names like event::EventType are standard Rust patterns
module_name_repetitions = "allow"
# Reason: Placeholder code has no real error docs yet
missing_errors_doc = "allow"
# Reason: Placeholder code has no real panic docs yet
missing_panics_doc = "allow"
# Reason: Placeholder code has no meaningful return values yet
must_use_candidate = "allow"

# Cargo profile used by cargo-dist for release-artifact builds. Required —
# release.yml's build-local-artifacts job runs `dist build --artifacts=local
# --target=X`, which invokes `cargo build --profile=dist`. Without this
# section, cargo errors with `profile 'dist' is not defined` and every
# per-target build fails. `dist init` normally adds this automatically, but
# our `allow-dirty = ["ci"]` blocks regeneration, so it lives here explicitly.
[profile.dist]
inherits = "release"
lto = "thin"
