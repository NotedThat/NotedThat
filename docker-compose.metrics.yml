# Prometheus metrics overlay for the Compose stack.
#
# The default stack records nothing and binds no metrics listener. This overlay turns the
# exporter on and adds a Prometheus that scrapes it, so request rates, search latency and
# the index queue can be graphed rather than read out of logs (D68):
#
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml up --build -d
#
# Pass both files to every command in that stack, `down` included. Combine with
# docker-compose.s3.yml, docker-compose.events.yml or docker-compose.auth.yml by listing
# all the files.
#
# The server binds its metrics listener to 0.0.0.0:9090 here, not to its 127.0.0.1
# default: a container is its own network namespace, so the default would be reachable
# only by the server itself and `prometheus` below could never scrape it. That port is
# deliberately NOT published — the namespace is what keeps the unauthenticated exposition
# off the host and off the LAN, exactly as loopback does on a bare host. Only Prometheus'
# own UI is published, and only on loopback.

services:
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: notedthat-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=0.0.0.0:9090"
    ports:
      - "127.0.0.1:${NOTEDTHAT_PROMETHEUS_PORT:-9090}:9090"   # Prometheus UI and API
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # `prom/prometheus` is built on busybox, so it has a shell and `wget`. If it ever
    # moves to a distroless base this probe fails silently — the same trap documented
    # for qdrant in docker-compose.yml.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 2s
    restart: unless-stopped

  notedthat-server:
    environment:
      NOTEDTHAT_METRICS_ENABLED: "true"
      # See the header: loopback would be unscrapable from another container.
      NOTEDTHAT_METRICS_LISTEN_ADDR: 0.0.0.0:9090
    # No `depends_on: prometheus`: the scraper depends on the target, not the other way
    # round, and a metrics overlay must not delay the product surface. The base stack's
    # qdrant dependency is repeated because an overlay's `depends_on` replaces it.
    depends_on:
      qdrant:
        condition: service_started

volumes:
  prometheus-data:
