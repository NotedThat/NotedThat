[package]
name = "notedthat-storage-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local filesystem storage adapter for NotedThat"
homepage.workspace = true
authors.workspace = true

[dependencies]
notedthat-core = { path = "../notedthat-core", version = "0.3.1" }
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
notify = "8.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "macros"] }
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true

[dev-dependencies]
notedthat-core = { path = "../notedthat-core", version = "0.3.1", features = ["test-support"] }
notedthat-storage-s3 = { path = "../notedthat-storage-s3", version = "0.3.1" }
temp-env = "0.3"
httpdate.workspace = true
testcontainers.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
