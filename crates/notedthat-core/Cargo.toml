[package]
name = "notedthat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared domain types, path/range/error/auth primitives, config for NotedThat"
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
# `InMemoryStorage` and the port reservation helper. The precondition and ETag
# logic it used to own now lives in `preconditions`/`etag`, unconditionally, because
# the filesystem adapter needs it in a production build.
test-support = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
subtle.workspace = true
tracing.workspace = true

hex.workspace = true
httpdate.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
tokio-util = { workspace = true, features = ["io"] }
tempfile.workspace = true

[dev-dependencies]
notedthat-core = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
