[package]
name = "notedthat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared domain types, path/range/error/auth primitives, config for NotedThat"
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
test-support = ["dep:sha2", "dep:hex", "dep:httpdate"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
subtle.workspace = true
tracing.workspace = true

hex = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
tokio-util = { workspace = true, features = ["io"] }
tempfile.workspace = true

[dev-dependencies]
notedthat-core = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
