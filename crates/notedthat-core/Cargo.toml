[package]
name = "notedthat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared domain types, path/range/error/auth primitives, config for NotedThat"
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
http.workspace = true
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
subtle.workspace = true
tracing.workspace = true

[features]
# Emit JSON Schema for the wire types, so the MCP tool surface can be generated
# from them instead of hand-mirrored. See D48.
schemars = ["dep:schemars"]

[lints]
workspace = true
