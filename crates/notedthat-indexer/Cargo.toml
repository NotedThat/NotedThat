[package]
name = "notedthat-indexer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Chunking, embedder client, and Qdrant integration for NotedThat"
readme = "README.md"

[features]
# In-memory VectorStore used by tests in this crate and downstream ones, so
# indexing and search can be exercised without a Qdrant container.
test-support = []

[dependencies]
notedthat-core = { path = "../notedthat-core", version = "0.5.0" }
qdrant-client = { workspace = true }
pulldown-cmark = { workspace = true }
text-splitter = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The crate's own tests exercise the in-memory VectorStore.
notedthat-indexer = { path = ".", features = ["test-support"] }
# One Qdrant container, for vector_store_conformance.rs only: it is what keeps
# InMemoryVectorStore honest about the backend it substitutes for.
testcontainers = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
