[package]
name = "notedthat-mcp-stdio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP-over-stdio transport adapter for NotedThat"
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
notedthat-mcp = { path = "../notedthat-mcp", version = "0.3.0" }
clap = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
notedthat-core = { path = "../notedthat-core", version = "0.3.0" }

[dev-dependencies]
temp-env = "0.3"

[lints]
workspace = true
