[package]
name = "notedthat-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NotedThat server library — HTTP API, WebDAV, and remote MCP in one process"
homepage.workspace = true
authors.workspace = true

[features]
# Exposes `run::Backends` and `run::run_with` so a test can start the real
# server over substituted backends. Off by default: those two items name
# `Storage`, `VectorStore` and `Embedder` in their signatures, and pinning
# those traits into the published API would make evolving them a breaking
# change to this crate.
test-support = []

[dependencies]
notedthat-core = { path = "../notedthat-core", version = "0.2.0" }
notedthat-storage-s3 = { path = "../notedthat-storage-s3", version = "0.2.0" }
# Both adapters, unconditionally rather than behind a cargo feature: the backend is
# chosen at runtime by NOTEDTHAT_STORAGE_BACKEND, so a feature would mean the published
# binary and the container image could only ever do one of them.
notedthat-storage-fs = { path = "../notedthat-storage-fs", version = "0.2.0" }
notedthat-api-http = { path = "../notedthat-api-http", version = "0.2.0" }
notedthat-webdav = { path = "../notedthat-webdav", version = "0.2.0" }
notedthat-indexer = { path = "../notedthat-indexer", version = "0.2.0" }
notedthat-mcp = { path = "../notedthat-mcp", version = "0.2.0" }  # M8 deliberate dependency extension — see plan §W1.3
notedthat-write = { path = "../notedthat-write", version = "0.2.0" }
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { workspace = true }
tower.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "json"] }
thiserror.workspace = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
# This crate's own E2E suites start the server through `run::run_with`.
notedthat-server = { path = ".", features = ["test-support"] }
notedthat-api-http = { path = "../notedthat-api-http", version = "0.2.0", features = ["test-support"] }
notedthat-indexer = { path = "../notedthat-indexer", version = "0.2.0", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json.workspace = true
temp-env = "0.3"
# One persistent SeaweedFS/Qdrant pair for tests/phase3_public_read_e2e.rs, the
# only suite in this crate that still needs real infrastructure. Everything else
# here runs on the in-process backends.
testcontainers = { workspace = true }
wiremock.workspace = true
base64.workspace = true

[lints]
workspace = true
