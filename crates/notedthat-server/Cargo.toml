[package]
name = "notedthat-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "NotedThat server library — HTTP API, WebDAV, and remote MCP in one process"
homepage.workspace = true
authors.workspace = true

[features]
# Exposes `run::Backends` and `run::run_with` so a test can start the real
# server over substituted backends. Off by default: those two items name
# `Storage`, `VectorStore` and `Embedder` in their signatures, and pinning
# those traits into the published API would make evolving them a breaking
# change to this crate.
#
# Also carries `testing`: the in-process servers and SSE reader the E2E suites
# share. They live in the library, not in `tests/support`, because each test
# binary compiling its own copy leaves whatever that binary does not call as
# dead code, which the workspace forbids (#304).
test-support = [
  "dep:futures",
  "notedthat-api-http/test-support",
  "notedthat-indexer/test-support",
  "notedthat-mcp/test-support",
  "reqwest/stream",
]

[dependencies]
notedthat-core = { path = "../notedthat-core", version = "0.12.3" }
notedthat-storage-s3 = { path = "../notedthat-storage-s3", version = "0.12.3" }
# Both adapters, unconditionally rather than behind a cargo feature: the backend is
# chosen at runtime by NOTEDTHAT_STORAGE_BACKEND, so a feature would mean the published
# binary and the container image could only ever do one of them.
notedthat-storage-fs = { path = "../notedthat-storage-fs", version = "0.12.3" }
notedthat-api-http = { path = "../notedthat-api-http", version = "0.12.3" }
notedthat-webdav = { path = "../notedthat-webdav", version = "0.12.3" }
notedthat-indexer = { path = "../notedthat-indexer", version = "0.12.3" }
notedthat-mcp = { path = "../notedthat-mcp", version = "0.12.3" }  # M8 deliberate dependency extension — see plan §W1.3
notedthat-write = { path = "../notedthat-write", version = "0.12.3" }
notedthat-events = { path = "../notedthat-events", version = "0.12.3" }
notedthat-nats = { path = "../notedthat-nats", version = "0.12.3" }
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
tower.workspace = true
# The product listener's accept loop (D71). `axum::serve` gives hyper no timer,
# and without one hyper cannot enforce a header-read timeout at all. HTTP/1
# only, like the axum features above.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "service", "tokio"] }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "json"] }
# OIDC: discovery and JWKS fetches, token verification, settings.
jsonwebtoken.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
url.workspace = true
# `testing::sse` reads an event stream chunk by chunk. Only with `test-support`.
futures = { workspace = true, optional = true }

[lib]
path = "src/lib.rs"

[dev-dependencies]
# This crate's own E2E suites start the server through `run::run_with`.
notedthat-server = { path = ".", features = ["test-support"] }
notedthat-api-http = { path = "../notedthat-api-http", features = ["test-support"] }
notedthat-indexer = { path = "../notedthat-indexer", features = ["test-support"] }
# `test-support` carries the MCP session client every `/mcp` suite drives.
notedthat-mcp = { path = "../notedthat-mcp", features = ["test-support"] }
# The event log adapters, for the events E2E suites: the memory ring in the
# ordinary pass, and the NATS adapter against a testcontainer under --ignored.
notedthat-events = { path = "../notedthat-events" }
async-nats.workspace = true
futures.workspace = true
# `stream` reads an SSE body chunk by chunk as it arrives.
reqwest = { workspace = true, features = ["stream"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
bytes.workspace = true
# A recorder the metered-wrapper tests can read back, to prove a dropped
# call still records. Already in the tree under `metrics-exporter-prometheus`.
metrics-util = { version = "0.20", features = ["debugging"] }
temp-env = "0.3"
tempfile.workspace = true
# One persistent SeaweedFS/Qdrant pair for tests/phase3_access_e2e.rs, the
# only suite in this crate that still needs real infrastructure. Everything else
# here runs on the in-process backends.
testcontainers = { workspace = true }
wiremock.workspace = true
# A client pointed at a wiremock S3 endpoint, for the conditional-write check (D70).
aws-sdk-s3.workspace = true
base64.workspace = true

[lints]
workspace = true
