[package]
name = "notedthat-events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Object change event log adapters for NotedThat: in-process ring and NATS JetStream"
homepage.workspace = true
authors.workspace = true

[dependencies]
notedthat-core = { path = "../notedthat-core", version = "0.13.0" }
notedthat-nats = { path = "../notedthat-nats", version = "0.13.0" }
async-nats.workspace = true
async-trait.workspace = true
bytes.workspace = true
metrics.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v7", "std"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
temp-env = "0.3"
# One NATS container, for tests/events_integration_nats.rs only: the same scenario
# set its memory sibling runs in the ordinary pass, over a real JetStream stream.
testcontainers = { workspace = true }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
