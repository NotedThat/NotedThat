# Authelia for manual QA of NotedThat's OIDC support — docker-compose.auth.yml.
#
# Everything in here is a throwaway development value: the secrets are
# public, the user passwords are in users_database.yml, and the signing key in
# jwks-private.pem is checked into the repository. Never reuse any of it.
#
# The parts that matter for NotedThat are marked ## NOTEDTHAT. Everything else
# is the minimum Authelia needs to boot with its file user backend.

theme: 'light'

server:
  address: 'tcp://0.0.0.0:9091'
  ## NOTEDTHAT: Authelia serves OIDC only over https — a plain-http discovery
  ## request is refused outright — so it terminates TLS itself with the leaf
  ## beside this file, signed by the throwaway ca.crt. NotedThat trusts that CA
  ## through NOTEDTHAT_OIDC_CA_CERT; the QA script passes it to curl --cacert.
  tls:
    certificate: '/config/tls.crt'
    key: '/config/tls.key'

log:
  level: 'info'

identity_validation:
  reset_password:
    jwt_secret: 'dev-only-reset-password-jwt-secret-please-change'

authentication_backend:
  file:
    path: '/config/users_database.yml'

access_control:
  default_policy: 'one_factor'

session:
  secret: 'dev-only-session-secret-please-change'
  cookies:
    # `auth.localhost` is the one name both sides use: the Compose network
    # aliases the container to it, and the QA script resolves it to 127.0.0.1.
    # The issuer Authelia writes into every token is derived from the request
    # host, so both sides must ask for the same name or `iss` never matches.
    - domain: 'auth.localhost'
      authelia_url: 'https://auth.localhost:9091'
    # The same instance reached by IP, for the in-repo Docker test, which has
    # no Compose network to alias a name in.
    - domain: '127.0.0.1'
      authelia_url: 'https://127.0.0.1:9091'

storage:
  encryption_key: 'dev-only-storage-encryption-key-please-change'
  local:
    path: '/config/db.sqlite3'

notifier:
  filesystem:
    filename: '/config/notification.txt'

identity_providers:
  oidc:
    hmac_secret: 'dev-only-oidc-hmac-secret-please-change'
