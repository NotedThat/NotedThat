    ## NOTEDTHAT: Authelia copies claims into the *access* token only through a
    ## claims policy. Without this, `groups` lives in the ID token alone and
    ## every `group:` rule stays unmatched.
    claims_policies:
      notedthat:
        access_token:
          - 'groups'
          - 'preferred_username'
    clients:
      - client_id: 'notedthat'
        client_name: 'NotedThat (manual QA)'
        # pbkdf2 of `notedthat-client-secret`
        client_secret: '$pbkdf2-sha512$310000$L6aXpwtg6RttxX.JQrBe9g$CYCwjsE/6CmKH3qNiU3VtrRDUT0.yhYMlCBzxP7zLMJVjftm7caqLguDwyFpQDCCl/j9VgfuYNUN5DBwKg9iCg'
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        ## NOTEDTHAT: a JWT access token rather than Authelia's default opaque one.
        access_token_signed_response_alg: 'RS256'
        ## NOTEDTHAT: RFC 9068 requires `aud` in a JWT access token and NotedThat
        ## checks it, but Authelia only emits one when the client is allowed an
        ## audience *and* asks for it. `implicit` asks for it on every request.
        audience:
          - 'notedthat'
        requested_audience_mode: 'implicit'
        claims_policy: 'notedthat'
        scopes:
          - 'openid'
          - 'profile'
          - 'groups'
          - 'email'
        redirect_uris:
          - 'http://127.0.0.1:1/callback'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        token_endpoint_auth_method: 'client_secret_post'
