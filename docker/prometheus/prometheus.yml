# Prometheus configuration for the NotedThat Compose stack.
# Mounted read-only by docker-compose.metrics.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: notedthat
    # The server's metrics listener, on the Compose network. Deliberately not
    # published to the host: the exposition is unauthenticated.
    static_configs:
      - targets: ["notedthat-server:9090"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
