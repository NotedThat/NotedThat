# Sentry Warden: LLM review of the PR diff.
#
# Runs once per model profile under .github/warden/. Profiles are separate
# subscriptions and fully independent: no merging, no cross-profile dedup,
# each posts its own PR review. Two profiles today:
#   - minimax: the cheap lane — the two built-in skills from warden.toml,
#     one hunk at a time, because the MiniMax Token Plan rate-limits
#     anything busier (see the overlay);
#   - thirdparty-gpt-oss: the wide lane — those two plus six more skills
#     declared in its overlay, on a third-party OpenAI-compatible endpoint
#     with no plan quota, whose location is a secret. (An OpenCode Go profile was tried and dropped because every model
# call from a GitHub runner failed with "provider unavailable" while working
# from a developer machine — see #131 before adding one.)
#
# Advisory only. `warden.toml` keeps failCheck/requestChanges off, so nothing
# here can block a merge; that stays a deliberate later decision (#131).
#
# Why the guards below:
#   - Same-repo PRs only: a fork PR gets no secrets, so the job would only fail.
#   - release-plz PRs are generated changelog/version bumps; nothing to review,
#     and each one would burn a full run's worth of requests.
#   - Draft PRs are filtered in warden.toml (`draft = false` on each trigger;
#     Warden's default is to review drafts too), not here, so a draft flipped
#     to ready gets reviewed on its next push without a workflow change.
name: Warden

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push supersedes the in-flight review of the same PR.
concurrency:
  group: warden-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The workflow token only reads: the diff, the PR, existing comments. All
# writes (reviews, check runs, resolving stale threads) go through each
# profile's GitHub App token, minted below; `contents: write` on the app
# is what Warden documents for resolving review threads via GraphQL.
permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    # Per profile: the MiniMax lane runs two hunks at a time by design and a
    # large feature PR (~350 hunks, PR #130) needs hours; the wide lane is
    # fast. Hitting the limit is a cancelled review, not a red X.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # One subscription being down must not cancel the other profile's review.
      fail-fast: false
      matrix:
        include:
          # Two words per profile decide every secret it uses:
          #   provider -> WARDEN_<provider>_API_KEY (and _BASE_URL when
          #               needs-base-url is set). Warden mirrors the key to
          #               the env name pi expects, so the word is also the
          #               provider selection.
          #   app      -> WARDEN_<app>_APP_ID / _PRIVATE_KEY: the GitHub App
          #               the lane posts as. Reviews then come from
          #               `warden-<model>[bot]` rather than github-actions[bot],
          #               which discloses the model, keeps the two lanes'
          #               check runs apart (check runs are namespaced per
          #               app, so Warden's hardcoded names no longer overwrite
          #               each other), and lets Warden recognise its own
          #               earlier review to dismiss it once addressed — a flow
          #               it skips outright under GITHUB_TOKEN.
          # Only a profile's own secrets are exported into its job, never as
          # an empty string.
          - profile: minimax
            provider: MINIMAX
            app: MINIMAX
            timeout: 300
          # The provider is declared in .github/warden/pi.
          - profile: thirdparty-gpt-oss
            provider: THIRDPARTY
            app: GPT_OSS
            needs-base-url: true
            timeout: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `env:` keys cannot be expressions, so the profile's secrets are
      # exported through GITHUB_ENV under their derived names. Values written
      # there stay masked in logs because they came from `secrets`.
      - name: Export the ${{ matrix.profile }} provider secrets
        env:
          PROVIDER: ${{ matrix.provider }}
          API_KEY: ${{ secrets[format('WARDEN_{0}_API_KEY', matrix.provider)] }}
          BASE_URL: ${{ secrets[format('WARDEN_{0}_BASE_URL', matrix.provider)] }}
          NEEDS_BASE_URL: ${{ matrix.needs-base-url || false }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::secret WARDEN_${PROVIDER}_API_KEY is not set for this repository"
            exit 1
          fi
          echo "WARDEN_${PROVIDER}_API_KEY=$API_KEY" >> "$GITHUB_ENV"
          if [ "$NEEDS_BASE_URL" = "true" ]; then
            if [ -z "$BASE_URL" ]; then
              echo "::error::secret WARDEN_${PROVIDER}_BASE_URL is not set for this repository"
              exit 1
            fi
            echo "WARDEN_${PROVIDER}_BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          fi

      # A model call that fails before any HTTP response surfaces in Warden
      # only as "Connection error", so check the endpoint is reachable from
      # this runner first and say so plainly. Prints the HTTP status and
      # curl's exit code only; the URL itself is a masked secret.
      - name: Preflight the ${{ matrix.profile }} endpoint
        if: matrix.needs-base-url
        env:
          URL: ${{ secrets[format('WARDEN_{0}_BASE_URL', matrix.provider)] }}
          KEY: ${{ secrets[format('WARDEN_{0}_API_KEY', matrix.provider)] }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $KEY" "$URL/models") || rc=$?
          echo "curl: GET <base-url>/models -> HTTP ${status:-none}, curl exit ${rc:-0}"
          if [ "${rc:-0}" -ne 0 ] || [ "${status:-000}" -ge 400 ]; then
            echo "::error::the ${{ matrix.provider }} endpoint is not usable from this runner (HTTP ${status:-none}, curl exit ${rc:-0})"
            exit 1
          fi
          # Warden's model calls go through Node's fetch, which has its own
          # DNS, TLS and proxy behaviour; a curl success does not prove it.
          echo "node $(node --version)"
          node -e '
            const url = process.env.URL + "/models";
            fetch(url, { headers: { authorization: "Bearer " + process.env.KEY } })
              .then(r => { console.log("node fetch: HTTP " + r.status); process.exit(r.ok ? 0 : 1); })
              .catch(e => { console.log("node fetch failed:", e.message, "|", e.cause && (e.cause.code + " " + e.cause.message)); process.exit(1); });
          ' || { echo "::error::Node cannot reach the ${{ matrix.provider }} endpoint from this runner (see above)"; exit 1; }

      # pi (Warden's runtime) learns providers it does not ship with from a
      # models.json in its agent directory. Copied out of the checkout so
      # anything pi writes next to it (session state, catalogue cache) never
      # lands in the tree Warden is reviewing. The placeholder base URL in
      # the committed file is replaced with the real one here: Warden's
      # WARDEN_<PROVIDER>_BASE_URL override did not reach a models.json
      # provider in the v0.48.0 action (every call went to the placeholder
      # and died as "Connection error"), so the copy must be complete on
      # its own.
      - name: Give pi the repo's provider catalogue
        env:
          BASE_URL: ${{ secrets[format('WARDEN_{0}_BASE_URL', matrix.provider)] }}
        run: |
          mkdir -p "$RUNNER_TEMP/pi-agent"
          cp .github/warden/pi/models.json "$RUNNER_TEMP/pi-agent/models.json"
          if [ -n "$BASE_URL" ]; then
            sed -i "s|https://example.invalid/v1|$BASE_URL|" "$RUNNER_TEMP/pi-agent/models.json"
          fi
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-agent" >> "$GITHUB_ENV"

      # Split analyze/report (the documented shape): analyze does all the model
      # work and writes a findings file without touching GitHub; report replays
      # that file into a PR review and check runs.
      #
      # `base-skill-root: .` because warden.toml is layered as the *base*
      # config, and Warden insists on knowing where a base config's repo-local
      # skills (.agents/skills/) live — the layering was built for org-wide
      # base configs checked out from another repository. Here it is this one.
      - name: Analyze (${{ matrix.profile }})
        id: analyze
        uses: getsentry/warden@775db57bee73caaeb6dcdafd5b56fd472dd6a0bc # v0.48.0
        with:
          mode: analyze
          base-config-path: warden.toml
          base-skill-root: .
          config-path: .github/warden/${{ matrix.profile }}.toml

      # A short-lived installation token for this profile's GitHub App; the
      # report step posts with it. Reads (the diff, existing comments) keep
      # using the workflow's own token. The app must be installed on the
      # organisation that owns this repository.
      - name: Mint the ${{ matrix.profile }} bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets[format('WARDEN_{0}_APP_ID', matrix.app)] }}
          private-key: ${{ secrets[format('WARDEN_{0}_PRIVATE_KEY', matrix.app)] }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Report (${{ matrix.profile }})
        uses: getsentry/warden@775db57bee73caaeb6dcdafd5b56fd472dd6a0bc # v0.48.0
        with:
          mode: report
          findings-file: ${{ steps.analyze.outputs.findings-file }}
          github-token: ${{ steps.bot.outputs.token }}
          base-config-path: warden.toml
          base-skill-root: .
          config-path: .github/warden/${{ matrix.profile }}.toml
