# Sentry Warden: LLM review of the PR diff.
#
# Runs one job per skill of each model profile under .github/warden/.
# Each profile is a complete, self-contained Warden config (shared review
# settings, models, skills); the lanes are fully independent — no merging,
# no cross-profile dedup — and within a lane each skill's job posts its own
# review, so a slow lane on a large PR still delivers the skills that
# finish. Three profiles today:
#   - minimax: the cheap lane — the two built-in skills, four hunks at a
#     time, the most the MiniMax Token Plan tolerates (see the profile);
#   - thirdparty-gpt-oss: the wide lane — those two plus six more skills,
#     on a third-party OpenAI-compatible endpoint with no plan quota, whose
#     location is a secret;
#   - thirdparty-deepseek: the two built-in skills again on DeepSeek V4
#     Flash, same endpoint and secrets as the wide lane, two hunks at a
#     time because the endpoint rate-limits that model.
# (An OpenCode Go profile was tried and dropped because every model call
# from a GitHub runner failed with "provider unavailable" while working
# from a developer machine — see #131 before adding one.)
#
# Every lane calls its provider through a self-hosted egress proxy rather
# than directly. It holds the real provider keys (the WARDEN_*_API_KEY
# secrets are the proxy's own token), keeps a global in-flight limit per
# provider so two PRs reviewed at once cannot trip the MiniMax plan, and
# adds `tool_choice: "auto"` on the third-party route, whose gateway
# otherwise turns a missing `tool_choice` into "none" and silently disables
# tool calling for pi (Warden's runtime never sends the field). The proxy's
# routes are the WARDEN_*_BASE_URL secrets.
#
# Advisory only. Every profile keeps failCheck/requestChanges off, so nothing
# here can block a merge; that stays a deliberate later decision (#131).
#
# Why the guards below:
#   - Same-repo PRs only: a fork PR gets no secrets, so the job would only fail.
#   - release-plz PRs are generated changelog/version bumps; nothing to review,
#     and each one would burn a full run's worth of requests.
#   - Draft PRs are filtered in the profiles (`draft = false` on each trigger;
#     Warden's default is to review drafts too), not here, so a draft flipped
#     to ready gets reviewed on its next push without a workflow change.
name: Warden

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push supersedes the in-flight review of the same PR.
concurrency:
  group: warden-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The workflow token only reads: the diff, the PR, existing comments. All
# writes (reviews, check runs, resolving stale threads) go through each
# profile's GitHub App token, minted below; `contents: write` on the app
# is what Warden documents for resolving review threads via GraphQL.
permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  # One job per (profile, skill), planned from the profiles themselves so
  # the job list cannot drift from the skills each profile declares. The
  # lane facts (provider, app, preflight path, timeout, per-job concurrency)
  # live in plan-jobs.py next to the profiles.
  plan:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: plan
        run: python3 .github/warden/plan-jobs.py >> "$GITHUB_OUTPUT"

  review:
    needs: plan
    name: review (${{ matrix.profile }}, ${{ matrix.skill }})
    runs-on: ubuntu-latest
    # Per skill: each job has its own budget, so a slow lane on a large PR
    # still posts the skills that finish. Hitting the limit is a cancelled
    # review, not a red X.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # One subscription being down must not cancel the other lanes' reviews.
      fail-fast: false
      # The provider's ceiling is what limits a lane, not the runner count:
      # the plan sizes each job's hunk concurrency so a lane's jobs together
      # stay within it (MiniMax four via the proxy's queue, DeepSeek two,
      # GPT-OSS unmetered).
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
      # Two words per lane decide how it runs:
      #   provider -> which route the preflight checks. The secrets
      #               themselves are the same for every lane: both
      #               providers' WARDEN_<provider>_API_KEY and _BASE_URL
      #               (the proxy token and the proxy route) are exported
      #               into every job, because each profile verifies its
      #               findings with a model from the other provider.
      #               Warden mirrors them to the names pi expects.
      #   app      -> WARDEN_<app>_APP_ID / _PRIVATE_KEY: the GitHub App
      #               the lane posts as. Reviews then come from
      #               `warden-<model>[bot]` rather than github-actions[bot],
      #               which discloses the model, keeps the lanes'
      #               check runs apart (check runs are namespaced per
      #               app, so Warden's hardcoded names no longer overwrite
      #               each other), and lets Warden recognise its own
      #               earlier review to dismiss it once addressed — a flow
      #               it skips outright under GITHUB_TOKEN. The jobs of one
      #               lane share an app: their `warden: <skill>` checks are
      #               distinct, only the aggregate `warden` check is
      #               re-created by each of them.
      # preflight-path is the models listing under the route, used only
      # to prove the proxy is reachable from the runner: the MiniMax
      # route speaks the Anthropic API, which lists under /v1/models.
      # Secrets are never exported as an empty string; a missing one
      # fails the job before any model call.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Both providers' secrets go into every job (see the matrix note):
      # exported through GITHUB_ENV under the names Warden expects. Values
      # written there stay masked in logs because they came from `secrets`.
      - name: Export the provider secrets
        env:
          WARDEN_MINIMAX_API_KEY: ${{ secrets.WARDEN_MINIMAX_API_KEY }}
          WARDEN_MINIMAX_BASE_URL: ${{ secrets.WARDEN_MINIMAX_BASE_URL }}
          WARDEN_THIRDPARTY_API_KEY: ${{ secrets.WARDEN_THIRDPARTY_API_KEY }}
          WARDEN_THIRDPARTY_BASE_URL: ${{ secrets.WARDEN_THIRDPARTY_BASE_URL }}
        run: |
          for name in WARDEN_MINIMAX_API_KEY WARDEN_MINIMAX_BASE_URL WARDEN_THIRDPARTY_API_KEY WARDEN_THIRDPARTY_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::secret ${name} is not set for this repository"
              exit 1
            fi
            echo "${name}=${!name}" >> "$GITHUB_ENV"
          done

      # A model call that fails before any HTTP response surfaces in Warden
      # only as "Connection error", so check the proxy route is reachable
      # from this runner first and say so plainly. Prints the HTTP status and
      # curl's exit code only; the URL itself is a masked secret.
      - name: Preflight the ${{ matrix.profile }} endpoint
        env:
          URL: ${{ secrets[format('WARDEN_{0}_BASE_URL', matrix.provider)] }}
          KEY: ${{ secrets[format('WARDEN_{0}_API_KEY', matrix.provider)] }}
          MODELS_PATH: ${{ matrix.preflight-path }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $KEY" "$URL$MODELS_PATH") || rc=$?
          echo "curl: GET <base-url>$MODELS_PATH -> HTTP ${status:-none}, curl exit ${rc:-0}"
          if [ "${rc:-0}" -ne 0 ] || [ "${status:-000}" -ge 400 ]; then
            echo "::error::the ${{ matrix.provider }} endpoint is not usable from this runner (HTTP ${status:-none}, curl exit ${rc:-0})"
            exit 1
          fi
          # Warden's model calls go through Node's fetch, which has its own
          # DNS, TLS and proxy behaviour; a curl success does not prove it.
          echo "node $(node --version)"
          node -e '
            const url = process.env.URL + process.env.MODELS_PATH;
            fetch(url, { headers: { authorization: "Bearer " + process.env.KEY } })
              .then(r => { console.log("node fetch: HTTP " + r.status); process.exit(r.ok ? 0 : 1); })
              .catch(e => { console.log("node fetch failed:", e.message, "|", e.cause && (e.cause.code + " " + e.cause.message)); process.exit(1); });
          ' || { echo "::error::Node cannot reach the ${{ matrix.provider }} endpoint from this runner (see above)"; exit 1; }

      # pi (Warden's runtime) reads a models.json from its agent directory:
      # it declares the third-party provider pi does not ship with, and
      # points the built-in `minimax` provider at the proxy. Copied out of
      # the checkout so anything pi writes next to it (session state,
      # catalogue cache) never lands in the tree Warden is reviewing. The
      # placeholder base URLs in the committed file are replaced with the
      # proxy routes here, because the WARDEN_<PROVIDER>_BASE_URL override
      # is not honoured inside the v0.48.0 action, only by the CLI: the
      # third-party lane found that on its first run (every call went to
      # the placeholder), and the MiniMax lane found it again when its
      # calls went straight to MiniMax with the proxy token (a 401 in
      # 350 ms, and not one request in the proxy's log). The copy must be
      # complete on its own; the env override stays exported for local
      # runs, where it does work.
      - name: Give pi the repo's provider catalogue
        env:
          MINIMAX_BASE_URL: ${{ secrets.WARDEN_MINIMAX_BASE_URL }}
          THIRDPARTY_BASE_URL: ${{ secrets.WARDEN_THIRDPARTY_BASE_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/pi-agent"
          cp .github/warden/pi/models.json "$RUNNER_TEMP/pi-agent/models.json"
          sed -i \
            -e "s|https://example.invalid/minimax|$MINIMAX_BASE_URL|" \
            -e "s|https://example.invalid/thirdparty|$THIRDPARTY_BASE_URL|" \
            "$RUNNER_TEMP/pi-agent/models.json"
          if grep -q 'example.invalid' "$RUNNER_TEMP/pi-agent/models.json"; then
            echo "::error::a provider base URL placeholder was not replaced; is every WARDEN_*_BASE_URL secret set?"
            exit 1
          fi
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-agent" >> "$GITHUB_ENV"

      # This job's config: the lane's profile reduced to the one skill, at
      # the per-job hunk concurrency from the plan. Written under .warden/
      # (git-ignored) because the action wants a path inside the checkout.
      - name: Reduce the profile to ${{ matrix.skill }}
        env:
          PROFILE: ${{ matrix.profile }}
          SKILL: ${{ matrix.skill }}
          CONCURRENCY: ${{ matrix.concurrency }}
        run: |
          mkdir -p .warden
          python3 .github/warden/one-skill.py ".github/warden/$PROFILE.toml" "$SKILL" "$CONCURRENCY" \
            > ".warden/$PROFILE-$SKILL.toml"
          echo "WARDEN_CONFIG_PATH=.warden/$PROFILE-$SKILL.toml" >> "$GITHUB_ENV"

      # Split analyze/report (the documented shape): analyze does all the model
      # work and writes a findings file without touching GitHub; report replays
      # that file into a PR review and check runs.
      #
      # One config file per job, no base-config-path: Warden runs a base
      # file's skills with the base file's own defaults, so a shared base
      # that left the model to the overlay handed the built-in skills to
      # pi's default model instead (see the profiles).
      - name: Analyze (${{ matrix.profile }}, ${{ matrix.skill }})
        id: analyze
        uses: getsentry/warden@775db57bee73caaeb6dcdafd5b56fd472dd6a0bc # v0.48.0
        with:
          mode: analyze
          config-path: ${{ env.WARDEN_CONFIG_PATH }}

      # A short-lived installation token for this profile's GitHub App; the
      # report step posts with it. Reads (the diff, existing comments) keep
      # using the workflow's own token. The app must be installed on the
      # organisation that owns this repository.
      - name: Mint the ${{ matrix.profile }} bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets[format('WARDEN_{0}_APP_ID', matrix.app)] }}
          private-key: ${{ secrets[format('WARDEN_{0}_PRIVATE_KEY', matrix.app)] }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Report (${{ matrix.profile }}, ${{ matrix.skill }})
        uses: getsentry/warden@775db57bee73caaeb6dcdafd5b56fd472dd6a0bc # v0.48.0
        with:
          mode: report
          findings-file: ${{ steps.analyze.outputs.findings-file }}
          github-token: ${{ steps.bot.outputs.token }}
          config-path: ${{ env.WARDEN_CONFIG_PATH }}
