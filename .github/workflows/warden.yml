# Sentry Warden: LLM review of the PR diff (security-review + code-review skills).
#
# Runs once per model profile under .github/warden/. Profiles are separate
# subscriptions and fully independent: no merging, no cross-profile dedup,
# each posts its own PR review. Only MiniMax M3 for now; an OpenCode Go
# profile was tried and dropped because every model call from a GitHub
# runner failed with "provider unavailable" (works from a developer
# machine) — see #131 before adding a second profile.
#
# Advisory only. `warden.toml` keeps failCheck/requestChanges off, so nothing
# here can block a merge; that stays a deliberate later decision (#131).
#
# Why the guards below:
#   - Same-repo PRs only: a fork PR gets no secrets, so the job would only fail.
#   - release-plz PRs are generated changelog/version bumps; nothing to review,
#     and each one would burn a full run's worth of requests.
#   - Draft PRs are filtered in warden.toml (`draft = false` on each trigger;
#     Warden's default is to review drafts too), not here, so a draft flipped
#     to ready gets reviewed on its next push without a workflow change.
name: Warden

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push supersedes the in-flight review of the same PR.
concurrency:
  group: warden-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# `contents: write` is what Warden documents for resolving stale review threads
# through GraphQL; the checkout itself does not persist credentials.
permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    # Generous on purpose: DeepSeek V4.1 Flash took 12 min on a 200-line PR in
    # the bake-off and Warden analyses hunks 4 at a time, so a large feature PR
    # runs well past 30 min. Hitting this is a cancelled review, not a red X.
    timeout-minutes: 60
    strategy:
      # One subscription being down must not cancel the other profile's review.
      fail-fast: false
      matrix:
        include:
          # Each profile names the one secret it needs. Warden mirrors
          # WARDEN_<PROVIDER>_API_KEY to the env name pi expects
          # (MINIMAX_API_KEY, OPENCODE_API_KEY), so the variable name is the
          # provider selection. Only that variable is exported into the job:
          # the other subscription's secret is never present, and no key
          # variable is ever set to an empty string.
          - profile: minimax
            key-var: WARDEN_MINIMAX_API_KEY
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `env:` keys cannot be expressions, so the profile's key is exported
      # through GITHUB_ENV instead. Values written there are still masked in
      # logs because they came from `secrets`.
      - name: Export the ${{ matrix.profile }} provider key
        env:
          KEY_VAR: ${{ matrix.key-var }}
          KEY_VALUE: ${{ secrets[matrix.key-var] }}
        run: |
          if [ -z "$KEY_VALUE" ]; then
            echo "::error::secret $KEY_VAR is not set for this repository"
            exit 1
          fi
          echo "$KEY_VAR=$KEY_VALUE" >> "$GITHUB_ENV"

      # Split analyze/report (the documented shape): analyze does all the model
      # work and writes a findings file without touching GitHub; report replays
      # that file into a PR review and check runs.
      #
      # `base-skill-root: .` because warden.toml is layered as the *base*
      # config, and Warden insists on knowing where a base config's repo-local
      # skills (.agents/skills/) live — the layering was built for org-wide
      # base configs checked out from another repository. Here it is this one.
      - name: Analyze (${{ matrix.profile }})
        id: analyze
        uses: getsentry/warden@v0.48.0
        with:
          mode: analyze
          base-config-path: warden.toml
          base-skill-root: .
          config-path: .github/warden/${{ matrix.profile }}.toml

      # With more than one profile, all jobs post the same hardcoded check-run
      # names (`warden`, `warden: <skill>`) and the last to finish owns the
      # checks tab; each profile's findings survive in its own PR review.
      # Warden gained a `post-checks` input to turn this off per job right
      # after v0.48.0 (getsentry/warden#458) — use it once a release ships it.
      - name: Report (${{ matrix.profile }})
        uses: getsentry/warden@v0.48.0
        with:
          mode: report
          findings-file: ${{ steps.analyze.outputs.findings-file }}
          base-config-path: warden.toml
          base-skill-root: .
          config-path: .github/warden/${{ matrix.profile }}.toml
