name: Publish crate (manual)

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to publish"
        required: true
        type: choice
        options:
          - notedthat-core
          - notedthat-storage-s3
          - notedthat-storage-fs
          - notedthat-indexer
          - notedthat-write
          - notedthat-nats
          - notedthat-events
          - notedthat-api-http
          - notedthat-webdav
          - notedthat-mcp
          - notedthat-server
          - notedthat

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: "Publish ${{ inputs.crate }}"
    runs-on: 9xx
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable

      # Mint short-lived OIDC token for crates.io (trusted publishing)
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish -p "${{ inputs.crate }}"
