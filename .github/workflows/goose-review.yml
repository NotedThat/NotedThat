# LLM review of the PR diff with Goose (block/goose), replacing Sentry Warden.
#
# Two lanes run, each posting as its own GitHub App so the reviews read as
# two reviewers: DeepSeek V4 Flash (via Albert) as warden-deepseek-v4[bot]
# and MiniMax M3 as warden-minimax-m3[bot]. The apps and their secrets keep
# their Warden names; only the tool behind them changed.
#
# Each lane runs every check in .agents/checks/ with its own model, then the
# *other* lane's model re-checks each finding against the code and only the
# confirmed ones are posted: a lane never verifies itself, the same rule the
# Warden profiles followed. .github/scripts/goose_review.py does all three
# steps; its docstring says why it drives `goose run` itself instead of
# using `goose review` (whose checks get no tools and cannot read the repo).
#
# Every model call goes through our self-hosted egress proxy, never to a
# provider directly. The proxy holds the provider keys (GOOSE_PROXY_TOKEN is
# the proxy's own token), paces requests per model -- Albert allows DeepSeek
# 50 a minute and the MiniMax plan shares one budget, and over-limit
# requests queue instead of failing -- and inserts `tool_choice: "auto"` on
# the Albert route, whose gateway otherwise defaults it to "none" and leaves
# every model unable to call a tool. The routes are the GOOSE_*_BASE_URL
# secrets, kept out of the repository on purpose.
#
# Advisory only: it posts COMMENT reviews, never requests changes, and the
# job never fails the PR. A check that does not finish (the MiniMax plan's
# quota, "Token Plan rate limit reached (2062)", is the usual cause) is named
# in the review as not covered rather than reported as clean.
name: Goose review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: goose-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Read-only for the job token; the review is posted with the lane's app token.
permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: review (${{ matrix.lane }})
    # Fork PRs get no secrets; release PRs are generated; drafts wait until
    # they are marked ready (the ready_for_review trigger picks them up).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && !startsWith(github.head_ref, 'release-plz-')
      && !startsWith(github.head_ref, 'release/')
      && !startsWith(github.event.pull_request.title, 'chore: release ')
    runs-on: ubuntu-latest
    # A tripwire, not an estimate: a small PR takes a few minutes per lane.
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: deepseek
            provider: notedthat_albert
            model: deepseek-v4-flash-0731
            verify-provider: notedthat_minimax
            verify-model: MiniMax-M3
            app: DEEPSEEK
          - lane: minimax
            provider: notedthat_minimax
            model: MiniMax-M3
            verify-provider: notedthat_albert
            verify-model: deepseek-v4-flash-0731
            app: MINIMAX
    env:
      GOOSE_VERSION: v1.52.0
      GOOSE_SHA256: 4aee1f770b405c44194c0e9407df1fb06bda4c50eee935f0d8fd10731821cc5e
      # No keyring on the runner; the key comes from the provider's env var.
      GOOSE_DISABLE_KEYRING: "1"
    steps:
      # The PR head itself, not the merge commit: review comments are
      # anchored to head_sha's line numbers.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the proxy secrets
        env:
          GOOSE_PROXY_TOKEN: ${{ secrets.GOOSE_PROXY_TOKEN }}
          GOOSE_ALBERT_BASE_URL: ${{ secrets.GOOSE_ALBERT_BASE_URL }}
          GOOSE_MINIMAX_BASE_URL: ${{ secrets.GOOSE_MINIMAX_BASE_URL }}
        run: |
          for name in GOOSE_PROXY_TOKEN GOOSE_ALBERT_BASE_URL GOOSE_MINIMAX_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::the $name secret is empty or not shared with this repository"
              exit 1
            fi
          done

      # Both routes, because every lane uses both models (one reviews, the
      # other verifies). Prints only the status, never the URL.
      - name: Preflight the proxy routes
        env:
          TOKEN: ${{ secrets.GOOSE_PROXY_TOKEN }}
          ALBERT: ${{ secrets.GOOSE_ALBERT_BASE_URL }}
          MINIMAX: ${{ secrets.GOOSE_MINIMAX_BASE_URL }}
        run: |
          for route in ALBERT MINIMAX; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $TOKEN" "${!route%/}/models") || rc=$?
            echo "$route: GET <route>/models -> HTTP ${status:-none}, curl exit ${rc:-0}"
            if [ "${rc:-0}" -ne 0 ] || [ "${status:-000}" -ge 400 ]; then
              echo "::error::the $route route is not usable from this runner"
              exit 1
            fi
          done

      - name: Install Goose ${{ env.GOOSE_VERSION }}
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o goose.tar.gz \
            "https://github.com/block/goose/releases/download/$GOOSE_VERSION/goose-x86_64-unknown-linux-gnu.tar.gz"
          echo "$GOOSE_SHA256  goose.tar.gz" | sha256sum -c -
          mkdir -p bin && tar xzf goose.tar.gz -C bin ./goose
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/goose" --version
          # Config (with our custom providers) and per-run transcripts live
          # outside the checkout the agent works in.
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/goose-config" >> "$GITHUB_ENV"
          echo "GOOSE_REVIEW_LOG_DIR=$RUNNER_TEMP/goose-logs" >> "$GITHUB_ENV"

      # The templates carry placeholders; the routes come from secrets.
      - name: Configure the Goose providers
        env:
          ALBERT: ${{ secrets.GOOSE_ALBERT_BASE_URL }}
          MINIMAX: ${{ secrets.GOOSE_MINIMAX_BASE_URL }}
        run: |
          out="$XDG_CONFIG_HOME/goose/custom_providers"
          .github/scripts/goose-render-provider.sh .github/goose/providers/notedthat_albert.json "$ALBERT" "$out"
          .github/scripts/goose-render-provider.sh .github/goose/providers/notedthat_minimax.json "$MINIMAX" "$out"

      # Title and body go through the environment into a file: PR text is
      # never interpolated into a script, and the prompts mark it as data.
      - name: Collect the PR description
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '# %s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pr.md"

      # The agent has a shell in this checkout, so nothing here may hold a
      # GitHub write token: the app token is created only after this step.
      - name: Review (${{ matrix.model }})
        env:
          NOTEDTHAT_PROXY_TOKEN: ${{ secrets.GOOSE_PROXY_TOKEN }}
        run: >
          python3 .github/scripts/goose_review.py review
          --base "${{ github.event.pull_request.base.sha }}"
          --provider "${{ matrix.provider }}" --model "${{ matrix.model }}"
          --context "$RUNNER_TEMP/pr.md"
          --out "$RUNNER_TEMP/findings.jsonl" --status "$RUNNER_TEMP/status.json"

      - name: Verify (${{ matrix.verify-model }})
        env:
          NOTEDTHAT_PROXY_TOKEN: ${{ secrets.GOOSE_PROXY_TOKEN }}
        run: >
          python3 .github/scripts/goose_review.py verify
          --base "${{ github.event.pull_request.base.sha }}"
          --provider "${{ matrix.verify-provider }}" --model "${{ matrix.verify-model }}"
          --context "$RUNNER_TEMP/pr.md"
          --in "$RUNNER_TEMP/findings.jsonl" --out "$RUNNER_TEMP/verified.jsonl"
          --status "$RUNNER_TEMP/status.json"

      - name: Create the ${{ matrix.lane }} app token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets[format('WARDEN_{0}_APP_ID', matrix.app)] }}
          private-key: ${{ secrets[format('WARDEN_{0}_PRIVATE_KEY', matrix.app)] }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Post the review
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: >
          python3 .github/scripts/goose_review.py post
          --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
          --lane "${{ matrix.lane }}" --model "${{ matrix.model }}"
          --in "$RUNNER_TEMP/verified.jsonl" --status "$RUNNER_TEMP/status.json"

      - name: Keep the findings and transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: goose-review-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/findings.jsonl
            ${{ runner.temp }}/verified.jsonl
            ${{ runner.temp }}/status.json
            ${{ runner.temp }}/goose-logs/
          if-no-files-found: ignore
          retention-days: 14
