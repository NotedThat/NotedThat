# LLM review of the PR diff with Goose (block/goose), replacing Sentry Warden.
#
# Four lanes run, one per model: DeepSeek V4 Flash, Mistral Medium 3.5 and
# Gemma 4 31B on the third-party endpoint, and MiniMax M3. All post as
# github-actions[bot] with the job's own token, so no GitHub App or private
# key is involved; every review and comment is signed with the model that
# wrote it and carries its lane's marker.
#
# Each lane runs the checks in .agents/checks/ that cover the changed files
# with its own model, then a model of another family re-checks each finding
# against the code and only the confirmed ones are posted: a lane never
# verifies itself, the same rule the Warden profiles followed. MiniMax M3
# verifies every lane but its own, which DeepSeek verifies: on #207 it was
# the verifier that let no false finding through.
# .github/scripts/goose_review.py does all three steps; its docstring says
# why it drives `goose run` itself instead of using `goose review` (whose
# checks get no tools and cannot read the repo).
#
# Every model call goes through our self-hosted egress proxy, never to a
# provider directly. The proxy holds the provider keys (GOOSE_PROXY_TOKEN is
# the proxy's own token), paces requests per model -- the third-party
# endpoint allows DeepSeek 50 a minute and the MiniMax plan shares one
# budget, and over-limit requests queue instead of failing -- and inserts
# `tool_choice: "auto"` on the third-party route, whose gateway otherwise
# defaults it to "none" and leaves every model unable to call a tool. The routes are the GOOSE_*_BASE_URL
# secrets, kept out of the repository on purpose.
#
# Advisory only: it posts COMMENT reviews, never requests changes, and the
# job never fails the PR. A check that does not finish (the MiniMax plan's
# quota, "Token Plan rate limit reached (2062)", is the usual cause) is named
# in the review as not covered rather than reported as clean.
name: Goose review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: goose-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each lane is .github/workflows/goose-review-lane.yml: a `review` job with
# a read-only token and its network limited to GitHub, crates.io and the
# proxy, and a `post` job that alone may write to the pull request. These
# are the most any lane's jobs may use.
permissions:
  contents: read
  pull-requests: write

jobs:
  lane:
    name: ${{ matrix.lane }}
    # Fork PRs get no secrets; release PRs are generated; drafts wait until
    # they are marked ready (the ready_for_review trigger picks them up).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && !startsWith(github.head_ref, 'release-plz-')
      && !startsWith(github.head_ref, 'release/')
      && !startsWith(github.event.pull_request.title, 'chore: release ')
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: deepseek
            provider: notedthat_thirdparty
            model: deepseek-v4-flash-0731
            verify-provider: notedthat_minimax
            verify-model: MiniMax-M3
            # The endpoint caps DeepSeek at 246,000 input tokens a minute, and
            # every agent turn resends the whole conversation: three checks at
            # once hit it on #207. The script also resumes a rate-limited run.
            jobs: 2
          - lane: minimax
            provider: notedthat_minimax
            model: MiniMax-M3
            verify-provider: notedthat_thirdparty
            verify-model: deepseek-v4-flash-0731
            jobs: 3
          # Two more model families, verified by MiniMax like DeepSeek: Gemma
          # passed Mistral's false claim that `**/` spans one directory at
          # most. This puts three lanes' verification on the MiniMax plan's
          # quota; a verification it cuts short withholds its findings as
          # unconfirmed, it never posts them.
          - lane: mistral
            provider: notedthat_thirdparty
            model: mistral-medium-3-5
            verify-provider: notedthat_minimax
            verify-model: MiniMax-M3
            jobs: 2
          - lane: gemma
            provider: notedthat_thirdparty
            model: gemma-4-31b-it
            verify-provider: notedthat_minimax
            verify-model: MiniMax-M3
            jobs: 2
    uses: ./.github/workflows/goose-review-lane.yml
    with:
      lane: ${{ matrix.lane }}
      provider: ${{ matrix.provider }}
      model: ${{ matrix.model }}
      verify-provider: ${{ matrix.verify-provider }}
      verify-model: ${{ matrix.verify-model }}
      jobs: ${{ matrix.jobs }}
    secrets: inherit

  # One comment for the whole run, once every lane is done: each lane's
  # models, what each check did, what it found and posted, and links to its
  # jobs. Lanes post a review only to show findings on the code, so this is
  # where a lane that was clean, not covered or did not run is reported.
  # The previous summary is deleted, so the latest is always the last
  # comment. It runs no model and reads only the lanes' result files.
  summary:
    name: summary
    needs: lane
    if: ${{ !cancelled() && needs.lane.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The job links for each lane.
      actions: read
      # The comment itself.
      issues: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443
            productionresultssa10.blob.core.windows.net:443
            productionresultssa11.blob.core.windows.net:443
            productionresultssa12.blob.core.windows.net:443
            productionresultssa13.blob.core.windows.net:443
            productionresultssa14.blob.core.windows.net:443
            productionresultssa15.blob.core.windows.net:443
            productionresultssa16.blob.core.windows.net:443
            productionresultssa17.blob.core.windows.net:443
            productionresultssa18.blob.core.windows.net:443
            productionresultssa19.blob.core.windows.net:443

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      # A lane whose post job failed before writing its result has none;
      # the summary then reports that lane from its job's conclusion.
      - name: Fetch the lanes' results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: goose-result-*
          merge-multiple: true
          path: ${{ runner.temp }}/results

      - name: Post the summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          mkdir -p "$RUNNER_TEMP/results" &&
          python3 .github/scripts/goose_review.py summary
          --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
          --head-sha "${{ github.event.pull_request.head.sha }}" --run-id "${{ github.run_id }}"
          --results "$RUNNER_TEMP/results"
