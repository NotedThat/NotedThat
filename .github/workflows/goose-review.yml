# LLM review of the PR diff with Goose (block/goose), through
# StephanMeijer/goose-review: the engine, its actions and its pre-composed
# workflow live there, pinned below by commit. What the review looks for
# stays here: the checks (.agents/checks/), the facts (.agents/facts/), the
# provider templates (.github/goose/providers/) and the Rust tool hints
# (.agents/goose-review/tools.md).
#
# Three lanes run, one per model: DeepSeek V4 Flash and Mistral Medium 3.5
# on the third-party endpoint, and MiniMax M3. All post as
# github-actions[bot] with the job's own token; every review and comment is
# signed with the model that wrote it.
#
# Each lane runs the checks that cover the changed files with its own model,
# then a model of another family re-checks each finding against the code and
# only the confirmed ones are posted: a lane never verifies itself. MiniMax
# M3 verifies every lane but its own, which DeepSeek verifies. Each verifier
# has the other as its backup, for when its provider is down (the MiniMax
# plan past its five-hour limit answers every request empty): then the
# DeepSeek lane verifies itself rather than withholding everything, and each
# comment names the model that confirmed it. On #207 both confirmed wrong
# findings at about the same rate (a quarter), mostly ones resting on wrong
# assumptions about GitHub Actions; MiniMax is kept because the other models
# verified worse, and the evidence requirement and .agents/facts/ are aimed
# at those findings.
#
# Every model call goes through our self-hosted egress proxy, never to a
# provider directly. The proxy holds the provider keys (GOOSE_PROXY_TOKEN is
# the proxy's own token), paces requests per model -- the third-party
# endpoint allows DeepSeek 50 a minute and the MiniMax plan shares one
# budget, and over-limit requests queue instead of failing -- and inserts
# `tool_choice: "auto"` on the third-party route, whose gateway otherwise
# defaults it to "none" and leaves every model unable to call a tool. The
# routes are the GOOSE_*_BASE_URL secrets and the proxy's host the
# GOOSE_PROXY_EGRESS variable, kept out of the repository on purpose.
#
# (DeepSeek V4.1 Flash on OpenRouter had a lane, reaching openrouter.ai
# directly, until it was turned off for its cost. Its provider file stays;
# to turn it back on, add a lane with `provider: notedthat_openrouter`,
# `OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}` to PROVIDER_ENV and
# "openrouter.ai:443" to egress-endpoints. The model's shell can read the key;
# its monthly spending limit on OpenRouter caps what a leak could cost.)
#
# Advisory only: it posts COMMENT reviews, never requests changes, and the
# job never fails the PR. A check that does not finish (the MiniMax plan's
# quota, "Token Plan rate limit reached (2062)", is the usual cause) is named
# in the review as not covered rather than reported as clean.
name: Goose review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A run in progress is never cancelled by a push: it finishes and posts, so
# the compute is not thrown away and its findings are answered or resolved
# like any other. The newest push waits for it; GitHub keeps one pending run
# per group, so pushes in between are dropped before they start. Nothing is
# missed that way: every run reviews the whole `base...head` diff.
concurrency:
  group: goose-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  goose-review:
    # Fork PRs get no secrets; release PRs are generated; drafts wait until
    # they are marked ready (the ready_for_review trigger picks them up).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && !startsWith(github.head_ref, 'release-plz-')
      && !startsWith(github.head_ref, 'release/')
      && !startsWith(github.event.pull_request.title, 'chore: release ')
    uses: StephanMeijer/goose-review/.github/workflows/review.yml@583a38a2ee99a7f01f76f39a81b9cd84076fadee # v0.3.2
    # The most the review's jobs use: the lanes' review jobs read, their
    # post jobs and tidy/summary write reviews and the summary comment, and
    # summary reads the run's jobs for its links.
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    with:
      # Checked before any lane runs (unknown keys, checks or providers stop
      # the run with the error shown).
      lanes: |
        - lane: deepseek
          provider: notedthat_thirdparty
          model: deepseek-v4-flash-0731
          verify-provider: notedthat_minimax
          verify-model: MiniMax-M3
          verify-backup-provider: notedthat_thirdparty
          verify-backup-model: deepseek-v4-flash-0731
          # The endpoint caps DeepSeek at 246,000 input tokens a minute, and
          # every agent turn resends the whole conversation: three checks at
          # once hit it on #207.
          jobs: 2

        - lane: minimax
          provider: notedthat_minimax
          model: MiniMax-M3
          verify-provider: notedthat_thirdparty
          verify-model: deepseek-v4-flash-0731
          verify-backup-provider: notedthat_minimax
          verify-backup-model: MiniMax-M3
          jobs: 3

        - lane: mistral
          provider: notedthat_thirdparty
          model: mistral-medium-3-5
          verify-provider: notedthat_minimax
          verify-model: MiniMax-M3
          verify-backup-provider: notedthat_thirdparty
          verify-backup-model: deepseek-v4-flash-0731
          jobs: 2   # the third-party endpoint's rate, as for DeepSeek

      #
      # The review job reaches GitHub and the proxy, and crates.io for
      # `cargo fetch`, which only downloads (nothing of the PR is built or
      # run) so the model can read what a library call really does. A JSON
      # list: harden-runner splits its allow-list on single spaces.
      egress-endpoints: >-
        ["index.crates.io:443", "static.crates.io:443", "${{ vars.GOOSE_PROXY_EGRESS }}"]
      setup: cargo fetch --locked
      tools-file: .agents/goose-review/tools.md
      # Never reviewed: build output, manual QA notes, tool caches, and files
      # that change mechanically.
      ignore: |
        target/**
        docs/manual-qa/**
        .codegraph/**
        **/Cargo.lock
        **/CHANGELOG.md
    secrets:
      PROVIDER_ROUTES: |
        notedthat_thirdparty=${{ secrets.GOOSE_THIRDPARTY_BASE_URL }}
        notedthat_minimax=${{ secrets.GOOSE_MINIMAX_BASE_URL }}
      PROVIDER_ENV: |
        NOTEDTHAT_PROXY_TOKEN=${{ secrets.GOOSE_PROXY_TOKEN }}
