name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --workspace --locked

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Dry-run Dockerfile build on every push and PR. Catches breakage before
  # release-plz can tag a broken commit. Runs the reusable docker.yml with
  # push=false — no GHCR login, no cosign, no secrets required (safe for
  # fork PRs). The upper bound on permissions here matches what the reusable
  # workflow declares at job level, even though push=false uses none of them.
  docker-build:
    name: Docker Build
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
      attestations: write
    with:
      push: false

  integration-test:
    name: Integration tests (SeaweedFS testcontainer)
    needs: [test, clippy, fmt]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository == 'NotedThat/NotedThat'
    runs-on: ubuntu-latest
    # Keep this budget tight on purpose. Almost everything here now runs on
    # in-memory backends (notedthat_indexer::testing, notedthat_api_http::testing),
    # so the only work that can grow without bound is what still needs real
    # infrastructure: the storage-s3 container suite and the mcp-stdio
    # subprocess tests that `--include-ignored` unlocks. This budget is the
    # tripwire for those. Raising the number would hide growth rather than fix it.
    #
    # Note what a breach costs, though: exceeding this does not FAIL the job,
    # it CANCELS it, and a cancelled dependency silently SKIPS release-plz
    # below — no release, and nothing reported as broken. So treat a timeout
    # here as a release outage, not a flaky test.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # `--include-ignored` is how the container-backed and subprocess tests get
      # run, but it also sweeps in the `stress_*` scenarios, which generate and
      # hash five gibibytes each and are meant to be run by hand (see
      # DEVELOPMENT.md). They are excluded by matching `stress_` rather than by
      # listing individual test names, so a newly added scenario stays out too.
      #
      # `--skip` is a SUBSTRING match over the full test path, not a name
      # prefix: anything with `stress_` anywhere in its module path or name is
      # dropped. That is the failure mode this whole job exists to prevent — a
      # test silently not running — so pin the count first. A new match, or a
      # renamed scenario that stops matching, fails here instead of quietly
      # changing what CI covers.
      - name: Check the stress filter still matches exactly the intended tests
        run: |
          set -euo pipefail
          expected=4
          listed=$(cargo test --workspace --locked -- --include-ignored --list)
          actual=$(printf '%s\n' "$listed" | grep -c 'stress_' || true)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::'--skip stress_' matches $actual tests, expected $expected."
            printf '%s\n' "$listed" | grep 'stress_' || true
            exit 1
          fi
          echo "stress filter matches $actual tests, as expected"
      - run: cargo test --workspace --locked -- --include-ignored --skip stress_

  # Two constraints on how the release-plz jobs are wired:
  #
  #   1. release-plz-pr MUST `needs:` release-plz-release, so the tag and the
  #      crates.io publish are visible before the PR job runs. Both jobs derive
  #      the next version from the crates.io baseline; run in parallel they read
  #      the SAME stale baseline, and the PR job re-proposes the very version the
  #      release job is publishing right then, producing duplicate CHANGELOG
  #      entries. This is also the order RELEASING.md documents.
  #
  #      Ordering alone is not sufficient: job completion says the publish
  #      returned, not that the sparse index serves it yet, and release-plz-pr
  #      re-queries that index. release-plz-release therefore blocks on the
  #      index actually showing the new version before it exits — see the
  #      "Wait for crates.io" step.
  #
  #      The cost of the dependency — a failed release skips that run's PR update
  #      and leaves the release PR stale — is bounded now that
  #      `release_always = true` (see release-plz.toml) lets the next push to main
  #      retry both jobs.
  #
  #   2. release-plz-release MUST NOT have a `concurrency:` block. GitHub
  #      cancels a *pending* run when a newer run for the same group is queued
  #      (independent of `cancel-in-progress`), so a rapid three-commit
  #      sequence to main causes commit 2's release to be silently dropped —
  #      its version never gets tagged or published to crates.io.
  #
  # release-plz-pr keeps a concurrency block: skipping a stale release-PR
  # update is safe because the newest queued run produces a fresh, correct PR
  # against the current HEAD.
  release-plz-release:
    name: Tag and publish crates
    needs: [test, clippy, fmt, docker-build, integration-test]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository == 'NotedThat/NotedThat'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      # actions: write is required so the follow-up step can dispatch
      # release.yml via `gh workflow run` (see below).
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz (release)
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # release-plz just pushed the workspace tag (e.g. v0.1.4) using
      # GITHUB_TOKEN. GitHub suppresses `push` triggers on tags created that
      # way (recursion prevention), so release.yml would never fire and no
      # binaries, docker image, cosign sigs, or attestations would be built.
      # workflow_dispatch IS allowed to be triggered by GITHUB_TOKEN — so we
      # chain to release.yml explicitly. The `..|.tag?` jq walker handles
      # either shape release-plz may emit (`{"releases":[...]}` or `[...]`),
      # and the `^v[0-9]` filter picks the workspace-wide tag (`v0.1.4`)
      # while skipping per-crate tags (`notedthat-mcp-stdio-v0.1.4`).
      - name: Trigger release.yml for the workspace tag
        if: steps.release-plz.outputs.releases != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag=$(printf '%s' "$RELEASES" | jq -r '..|.tag? // empty | select(test("^v[0-9]"))' | head -n1)
          if [ -n "$tag" ] && [ "$tag" != "null" ]; then
            echo "Dispatching release.yml against tag $tag"
            gh workflow run release.yml --ref "$tag" --repo "$GITHUB_REPOSITORY"
          else
            echo "No workspace tag (v*) in release-plz output; nothing to dispatch"
          fi

      # release-plz-pr `needs:` this job and re-queries crates.io to derive the
      # next version. A publish that has returned but is not yet in the sparse
      # index looks identical to "nothing was released", so the PR job would
      # re-propose the version just published and write a duplicate CHANGELOG
      # entry. Hold this job open until the index agrees.
      #
      # The crate list and version come from the checked-in workspace manifests
      # via `cargo metadata`, not from release-plz's output, so this does not
      # depend on that tool's JSON shape. Index paths are the standard sparse
      # layout: <first-2>/<next-2>/<name> for names of four characters or more.
      - name: Wait for crates.io to index the published version
        if: steps.release-plz.outputs.releases != ''
        timeout-minutes: 10
        run: |
          set -euo pipefail
          meta=$(cargo metadata --no-deps --format-version 1)
          version=$(printf '%s' "$meta" \
            | jq -er '[.packages[] | select(.publish != []) | .version] | unique | .[0]')
          crates=$(printf '%s' "$meta" \
            | jq -er '.packages[] | select(.publish != []) | .name')
          echo "Waiting for $version to appear in the crates.io index"
          # Read line by line rather than iterating an unquoted variable: crate
          # names are newline-separated, and relying on IFS word-splitting here
          # silently degrades to one garbage URL if the shell does not split.
          while read -r crate; do
            [ -n "$crate" ] || continue
            url="https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}"
            until curl -sfL "$url" \
              | jq -es --arg v "$version" 'any(.[]; .vers == $v)' >/dev/null; do
              echo "  $crate $version not indexed yet; retrying in 5s"
              sleep 5
            done
            echo "  $crate $version indexed"
          done <<< "$crates"

  release-plz-pr:
    name: Open / update release PR
    needs: [test, clippy, fmt, docker-build, integration-test, release-plz-release]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository == 'NotedThat/NotedThat'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz (release-pr)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
