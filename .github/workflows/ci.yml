name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # `toolchain` is a matrix because Cargo.toml declares a workspace
  # `rust-version`, and that number is baked into all 12 published manifests.
  # A declared MSRV that nothing compiles against is a claim, not a fact; this
  # leg is what makes it true. When a dependency raises its own floor, this
  # fails with "package X requires rustc N" instead of the project shipping a
  # manifest that lies to consumers.
  #
  # Only `test` gets the matrix, on purpose:
  #   * `fmt` has one canonical output and it is stable's — rustfmt is not
  #     byte-stable across releases, so a second leg gives a false failure or a
  #     meaningless pass.
  #   * `clippy` runs `-D warnings` over the `pedantic` group, whose membership
  #     moves between releases in both directions (see the 1.97
  #     `manual_assert_eq` entry in CHANGELOG.md). A second toolchain there
  #     reports lint churn, not defects.
  #   * `package` verifies by building — a duplicate of this job's compile — and
  #     what it uniquely checks (per-crate feature unification) is
  #     toolchain-independent.
  #   * `integration-test` needs containers and five minutes. An MSRV is a
  #     compilation property; running SeaweedFS twice buys nothing.
  #
  # Note this gates releases: `release-plz-release` needs `test`, so a red MSRV
  # leg blocks the tag and the crates.io publish. That is the intent — it is
  # exactly the manifest claim that would otherwise ship unverified.
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      # Both legs always report. "stable green, MSRV red" is a different
      # diagnosis from "both red", and fail-fast would hide which one it is.
      fail-fast: false
      matrix:
        toolchain: [stable, "1.94.1"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # `@master` rather than `@stable`: for this action the ref IS the
      # toolchain, and GitHub does not allow an expression in `uses:`, so the
      # toolchain has to arrive as an input instead — which only the `master`
      # ref accepts. `stable` is a valid value for it.
      #
      # SHA-pinned because `master` moves with every commit to that repository,
      # which would be a looser ref than the `@stable` it replaces. This matches
      # how `Swatinem/rust-cache` below is already pinned; it is not a decision
      # about the other tag-pinned actions in this repository.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # rust-cache already folds `rustc -vV` into its key, so the two legs
          # cannot collide. This is for legibility in the cache listing.
          key: ${{ matrix.toolchain }}
      # This is also the staleness check for docs/openapi.json (D77):
      # `notedthat-api-http`'s `openapi` test compares the committed document
      # with the one the handlers generate, so a contract change that was not
      # regenerated fails here, and — since this job gates release — cannot
      # ship. A separate diff step would check the same bytes a second time.
      - run: cargo test --workspace --locked

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # dead_code is `deny` in Cargo.toml, so unused code fails the build; this
      # refuses the way around that, an allow or expect of dead_code or of the
      # `unused` group containing it. Dead code is deleted (#304). The pattern
      # is anchored on `#[`/`#![` (cfg_attr included) and runs to the closing
      # `]`, so a `.expect("…unused…")` call is not mistaken for an attribute.
      # The lint list stops at the first `"`: rustc puts `reason = "…"` last,
      # and the word "unused" in a reason suppresses nothing.
      - name: No dead_code suppressions
        run: |
          offenders=$(git ls-files -z -- '*.rs' | xargs -0 perl -0777 -ne 'print "$ARGV\n" if /#\s*!?\s*\[\s*(?:cfg_attr\s*\([^\]]*?)?\b(?:allow|expect)\s*\([^\]"]*\b(?:dead_code|unused)\b/')
          if [ -n "$offenders" ]; then
            echo "::error::dead code is deleted, not suppressed (#304). Offending files:"
            echo "$offenders"
            exit 1
          fi
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Fails on a dependency a crate declares but never names. Every crate here is
  # published, so an unused entry is not a local cost: each downstream consumer
  # compiles it and everything it pulls in (#302 — `aws-config` alone dragged
  # `aws-sdk-sts` into every build of notedthat-storage-s3). Neither the
  # compiler nor clippy notices, so without this it only surfaces in a sweep.
  #
  # cargo-machete reads sources and manifests and compiles nothing, so, like
  # `fmt`, there is no rust-cache; it runs in seconds. A false positive — a
  # dependency used only through a macro that does not name it — is suppressed
  # in that crate's Cargo.toml under `[package.metadata.cargo-machete]
  # ignored`, with a reason, never with a flag here.
  machete:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Renovate bumps the action SHA but CANNOT see `tool:`, so the
      # cargo-machete version moves by hand, in two places: here and
      # DEVELOPMENT.md.
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  # Dry-run `cargo package` on every push and PR, for the same reason the
  # Dockerfile build is dry-run here: release-plz packages each crate on its
  # own, and a crate that only compiles because a sibling in the workspace
  # switched a shared feature on is a failure nothing else catches. `cargo
  # test`, `clippy` and `docker` all build the workspace as one unit, where
  # Cargo unifies features across every member; the packaged crate has only
  # the features its own Cargo.toml asks for.
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo package --workspace --locked
      # A dev-dependency on a workspace crate carries `path` only, never
      # `version`. Cargo strips a path-only dev-dependency from the published
      # manifest; one with a version stays in it and is resolved against
      # crates.io when the crate is published. release-plz orders publishes by
      # normal dependencies alone, so a versioned dev-dependency on a crate that
      # is not on crates.io yet fails the *dependent* before release-plz ever
      # reaches the crate itself — which is how notedthat-indexer blocked every
      # release after notedthat-events was added (RELEASING.md, "Adding a
      # crate"). `cargo metadata` reports a path-only dev-dependency's
      # requirement as `*`.
      #
      # Checked on the ground truth rather than on intent: `cargo package` above
      # has just written the normalised manifest Cargo would upload for every
      # crate, and a dev-dependency Cargo kept is one it will resolve at publish
      # time, whatever spelling put it there (`version = "*"` reads as `*` in
      # `cargo metadata` too, and would slip past an intent check; one renamed
      # with `package = "notedthat-…"` keeps the crate under another key, so the
      # crate name is what is compared, not the key).
      - name: Packaged manifests name no workspace crate as a dev-dependency
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --format-version 1 --no-deps)
          target=$(jq -r '.target_directory' <<< "$metadata")
          # Only this version's packages: a restored cache can hold older ones.
          version=$(jq -r '.packages[0].version' <<< "$metadata")
          jq -r '.packages[].name' <<< "$metadata" > /tmp/members
          python3 - "$target"/package/*-"$version"/Cargo.toml <<'PY'
          import sys, tomllib
          members = set(open("/tmp/members").read().split())
          bad = []
          for path in sys.argv[1:]:
              with open(path, "rb") as f:
                  manifest = tomllib.load(f)
              kept = []
              for name, spec in manifest.get("dev-dependencies", {}).items():
                  crate = spec.get("package", name) if isinstance(spec, dict) else name
                  if crate in members:
                      kept.append(name if crate == name else f"{name} (package = {crate})")
              if kept:
                  bad.append(f"{manifest['package']['name']}: {', '.join(kept)}")
          if bad:
              print("::error::a packaged manifest still names a workspace crate as a dev-dependency — "
                    "drop `version` (or `workspace = true`) and keep `path`; see RELEASING.md, Adding a crate: "
                    + "; ".join(bad))
              sys.exit(1)
          print(f"checked {len(sys.argv) - 1} packaged manifests: no workspace dev-dependencies kept")
          PY

  # Dependency advisories were noticed here but never gated. GitHub's alerts
  # raise a notification and Renovate raises an update PR; neither fails
  # anything, so a known-vulnerable dependency could sit in Cargo.lock for as
  # long as nobody happened to read the notification. This job covers the
  # Cargo graph directly.
  #
  # Runs on pull requests AND on pushes to `main`, and that split is worth
  # stating rather than discovering:
  #
  #   1. It does NOT gate a release. `release-plz-release` does not `needs:`
  #      this job, so a tag cut after an advisory lands will publish eleven
  #      crates and a signed image carrying it. That is a deliberate scope
  #      choice — releases here are gated on `test`, `clippy`, `fmt`,
  #      `docker-build` and `integration-test`, and this is not in that set.
  #      Running on `main` changes nothing about that, which is exactly why it
  #      costs nothing to do: a red run here blocks no tag.
  #   2. The `main` run is what tells an author a red check is not their diff.
  #      An advisory filed against a dependency nobody touched turns every open
  #      pull request red at once; without a run on `main` there is nothing to
  #      compare against, and the author of an unrelated change goes looking
  #      through their own diff for it. The fix belongs on `main` — update the
  #      lockfile, or add an `ignore` entry to deny.toml with a reason and a
  #      link — not in the pull request that happened to be open.
  #   3. Neither trigger fires while the repository is quiet, and an advisory
  #      does not wait for someone to push. `advisories.yml` runs the same
  #      check on a schedule for that. It is a separate workflow because a
  #      `schedule:` trigger here would fire every other job in this file too.
  #
  # The advisory database cannot be pinned, and pretending otherwise would be
  # worse than not pinning it: a database frozen at a commit only knows the
  # advisories that existed when it was frozen, which is precisely the thing
  # being defended against. What IS pinned is the tool (an exact cargo-deny
  # version below) and the database's SOURCE (`db-urls` in deny.toml), so the
  # check cannot be silently redirected. The honest statement is that this job
  # is not reproducible across time by design, and a green run is a claim about
  # today only.
  #
  # Nothing is compiled — cargo-deny reads Cargo.lock and the advisory database
  # — so there is no toolchain step and no rust-cache, for the same reason
  # `fmt` has none. It runs alongside `test`, `clippy` and `package`, every one
  # of which is longer, so it adds nothing to the pull-request feedback time
  # #87 measured at about six minutes.
  advisories:
    runs-on: ubuntu-latest
    # A tripwire on a hung advisory-database fetch, not a budget on the check,
    # which takes about a second. Note this CANCELS rather than fails, which is
    # harmless only because nothing `needs:` this job — and is the first thing
    # that stops being harmless if the release gate above is ever wired to it.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned to an exact cargo-deny version rather than using
      # EmbarkStudios/cargo-deny-action, which is a Docker action: it builds an
      # image on the runner every run and resolves the graph under whatever
      # toolchain its Dockerfile pins, rather than the `@stable` every other job
      # here uses. Installing the binary also keeps the command below
      # byte-identical to the one in DEVELOPMENT.md — a scanner nobody can run
      # locally is a scanner people argue with instead of fix.
      #
      # Renovate bumps the action SHA but CANNOT see `tool:`, so the cargo-deny
      # version moves by hand, in two places: here and DEVELOPMENT.md.
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-deny@0.20.2
      # Everything that shapes this check lives in deny.toml, deliberately: a
      # flag here would be a suppression that never appears in a review.
      # `--locked` is the same assertion every other cargo call in CI makes —
      # judge the lockfile that ships, not what the resolver would pick today.
      - run: cargo deny --locked check advisories
      # The database cannot be pinned, so record which one judged this run.
      # `if: always()` because a red run is precisely the one worth reproducing
      # months later, and without this the evidence is gone.
      - name: Record the advisory database revision this run judged against
        if: always()
        run: |
          set -euo pipefail
          # Tested before walked: `find` on a missing path exits non-zero, and
          # under `set -e` with `pipefail` that aborted the step before the
          # branch below could report why there was nothing to record — which
          # is only ever the case when `cargo deny` failed before fetching a
          # database, i.e. exactly the run this step exists to document.
          dbs="${CARGO_HOME:-$HOME/.cargo}/advisory-dbs"
          if [ ! -d "$dbs" ]; then
            echo "::warning::no advisory database was cloned; the check failed before fetching one"
            exit 0
          fi
          # Every database, not the first `find` happened to emit: `db-urls`
          # names one source today, and if a second is ever added the recorded
          # revision should not silently be whichever one came out first.
          recorded=0
          for db in "$dbs"/*/; do
            [ -d "$db/.git" ] || continue
            echo "::notice::judged against RustSec advisory-db $(basename "$db") $(git -C "$db" rev-parse HEAD) ($(git -C "$db" log -1 --format=%cI))"
            recorded=1
          done
          [ "$recorded" = 1 ] || echo "::warning::$dbs exists but holds no git checkout to record"

  # Dry-run Dockerfile build on every push and PR. Catches breakage before
  # release-plz can tag a broken commit. Runs the reusable docker.yml with
  # push=false — no GHCR login, no cosign, no secrets required (safe for
  # fork PRs). The upper bound on permissions here matches what the reusable
  # workflow declares at job level, even though push=false uses none of them.
  docker-build:
    name: Docker Build
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
      attestations: write
    with:
      push: false

  # Runs on pull requests as well as pushes to main. The `--include-ignored`
  # suite is what proves the cross-surface authorization boundary of the unified
  # listener (Bearer never reaching /webdav, Basic never reaching /api/v1 or
  # /mcp). Gating a merge on evidence that only arrives after the merge is the
  # wrong order for that check. No secrets are used, so it is safe on fork PRs.
  integration-test:
    name: Integration tests (SeaweedFS testcontainer)
    needs: [test, clippy, fmt]
    if: >-
      github.repository == 'NotedThat/NotedThat'
      && (github.event_name == 'pull_request'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    # Keep this budget tight on purpose. Almost everything here now runs on
    # in-memory backends (notedthat_indexer::testing, notedthat_api_http::testing),
    # so the only work that can grow without bound is what still needs real
    # infrastructure: the container suites that `--include-ignored` unlocks.
    # This budget is the tripwire for those. Raising the number would hide growth rather than fix it.
    #
    # Note what a breach costs, though: exceeding this does not FAIL the job,
    # it CANCELS it, and a cancelled dependency silently SKIPS release-plz
    # below — no release, and nothing reported as broken. So treat a timeout
    # here as a release outage, not a flaky test.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # `--include-ignored` is how the container-backed and subprocess tests get
      # run, but it also sweeps in the `stress_*` scenarios, which generate and
      # hash five gibibytes each and are meant to be run by hand (see
      # DEVELOPMENT.md). They are excluded by matching `stress_` rather than by
      # listing individual test names, so a newly added scenario stays out too.
      #
      # `--skip` is a SUBSTRING match over the full test path, not a name
      # prefix: anything with `stress_` anywhere in its module path or name is
      # dropped. That is the failure mode this whole job exists to prevent — a
      # test silently not running — so pin the count first. A new match, or a
      # renamed scenario that stops matching, fails here instead of quietly
      # changing what CI covers.
      - name: Check the stress filter still matches exactly the intended tests
        run: |
          set -euo pipefail
          expected=4
          listed=$(cargo test --workspace --locked -- --include-ignored --list)
          actual=$(printf '%s\n' "$listed" | grep -c 'stress_' || true)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::'--skip stress_' matches $actual tests, expected $expected."
            printf '%s\n' "$listed" | grep 'stress_' || true
            exit 1
          fi
          echo "stress filter matches $actual tests, as expected"
      - run: cargo test --workspace --locked -- --include-ignored --skip stress_

  # Two constraints on how the release-plz jobs are wired:
  #
  #   1. release-plz-pr MUST `needs:` release-plz-release, so the tag and the
  #      crates.io publish are visible before the PR job runs. Both jobs derive
  #      the next version from the crates.io baseline; run in parallel they read
  #      the SAME stale baseline, and the PR job re-proposes the very version the
  #      release job is publishing right then, producing duplicate CHANGELOG
  #      entries. This is also the order RELEASING.md documents.
  #
  #      Ordering alone is not sufficient: job completion says the publish
  #      returned, not that the sparse index serves it yet, and release-plz-pr
  #      re-queries that index. release-plz-release therefore blocks on the
  #      index actually showing the new version before it exits — see the
  #      "Wait for crates.io" step.
  #
  #      The dependency is on *completion*, not success: release-plz-pr runs
  #      after a failed release too (see its `if:`). A release that fails
  #      before publishing anything leaves the crates.io baseline exactly as
  #      the PR job expects, and the PR it opens may be the only way out. On
  #      2026-09-20 the merge that added `notedthat-events` (#141) failed here:
  #      the new crate sat at the workspace version 0.7.0, which was not on
  #      crates.io, so `release_always` tried to publish it — against the
  #      published notedthat-core 0.7.0, which lacks the event types it imports.
  #      Only a version bump gets core and events onto crates.io together, and
  #      the bump comes from the release PR, which a `needs:` on success had
  #      skipped. Every later push to main repeated the failure.
  #
  #      A release that fails *partway* (some crates published) is the case
  #      `release_always = true` (see release-plz.toml) exists for: the next
  #      push to main retries and skips what is already published. A release PR
  #      opened in between is refreshed by that run.
  #
  #   2. release-plz-release MUST NOT have a `concurrency:` block. GitHub
  #      cancels a *pending* run when a newer run for the same group is queued
  #      (independent of `cancel-in-progress`), so a rapid three-commit
  #      sequence to main causes commit 2's release to be silently dropped —
  #      its version never gets tagged or published to crates.io.
  #
  # release-plz-pr keeps a concurrency block: skipping a stale release-PR
  # update is safe because the newest queued run produces a fresh, correct PR
  # against the current HEAD.
  release-plz-release:
    name: Tag and publish crates
    needs: [test, clippy, fmt, docker-build, integration-test]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository == 'NotedThat/NotedThat'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      # actions: write is required so the follow-up step can dispatch
      # release.yml via `gh workflow run` (see below).
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Trusted Publishing cannot create a crate, so a workspace member that has
      # never been published cannot go out through this job at all: until
      # someone bootstraps it (RELEASING.md, "Adding a Crate to the
      # Workspace"), release-plz fails on it on every push to main — first as a
      # `cargo publish` verify error against its siblings' previous publish,
      # after the version bump as an HTTP 403. That is a known, documented
      # state, and a red main in the meantime hides real failures.
      #
      # So hold it back instead: every crate that 404s on crates.io, plus every
      # publishable crate that depends on one (normal or build dependencies;
      # dev-dependencies on workspace crates are path-only and stripped from the
      # published manifest, see RELEASING.md), is set to `release = false` in a
      # copy of release-plz.toml for this run only. Everything else still
      # publishes — including the new crate's own dependencies at the new
      # version, which is what its bootstrap builds against. The facade
      # `notedthat` is always held back while anything is, whether or not it
      # depends on the missing crate: it owns the workspace tag, the GitHub
      # Release and the release.yml dispatch, so none of those happen until the
      # whole workspace is on crates.io. The held-back crates are named in a
      # warning and in the job summary.
      #
      # If that holds back every publishable crate (the missing crate is one
      # that notedthat-core depends on), there is nothing left to publish and
      # release-plz would fail with "no public packages found", so the step
      # sets `skip=true` and release-plz does not run at all.
      #
      # Only a definite 404 holds a crate back. Any other answer (a timeout, a
      # 5xx) leaves the crate in, so release-plz publishes it as usual and a
      # real error still fails the job. When nothing is held back, release-plz
      # gets the checked-in release-plz.toml unchanged.
      - name: Hold back crates that have never been published
        id: preflight
        run: |
          set -euo pipefail
          meta=$(cargo metadata --format-version 1 --no-deps)
          publishable=$(jq -r '.packages[] | select(.publish == null or (.publish | length) > 0) | .name' <<<"$meta")
          version=$(jq -er '[.packages[] | select(.publish != []) | .version] | unique | .[0]' <<<"$meta")

          missing=()
          while read -r crate; do
            [ -n "$crate" ] || continue
            # `|| true`: under `set -e` a curl that could not connect would
            # otherwise exit the script here; `--max-time` so a stalled
            # connection cannot hang the job once per crate.
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                     -H 'User-Agent: notedthat-ci (https://github.com/NotedThat/NotedThat)' \
                     "https://crates.io/api/v1/crates/${crate}" || true)
            case "${status:-000}" in
              200) ;;
              404) missing+=("$crate") ;;
              *)   echo "::warning::could not check ${crate} on crates.io (HTTP ${status:-000}); not holding it back, release-plz will try to publish it as usual" ;;
            esac
          done <<<"$publishable"

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Every publishable crate is on crates.io; running release-plz with release-plz.toml unchanged."
            {
              echo "config=release-plz.toml"
              echo "held-back="
              echo "skip=false"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # The never-published crates plus, transitively, every publishable
          # workspace crate with a normal or build dependency on one of them.
          # The facade `notedthat` is seeded too, whatever its dependencies, so
          # no tag or GitHub Release goes out while anything is missing.
          held=$(jq -r --argjson seeds "$(printf '%s\n' "${missing[@]}" | jq -R . | jq -sc .)" '
            [.packages[] | select(.publish != [])
              | {name, deps: [.dependencies[] | select(.path != null and .kind != "dev") | .name]}] as $pkgs
            | def grow($s):
                ([$pkgs[] | select(any(.deps[]; IN($s[]))) | .name] + $s | unique) as $n
                | if ($n | length) == ($s | length) then $s else grow($n) end;
              grow($seeds + ["notedthat"] | unique)[]' <<<"$meta")

          config="$RUNNER_TEMP/release-plz.toml"
          cp release-plz.toml "$config"
          while read -r crate; do
            if grep -qx "name = \"${crate}\"" "$config"; then
              # The crate already has a [[package]] table (the facade does):
              # add the key to it, since a second table for the same name
              # would be ambiguous.
              awk -v line="name = \"${crate}\"" '{ print } $0 == line { print "release = false" }' \
                "$config" >"$config.new"
              mv "$config.new" "$config"
            else
              printf '\n[[package]]\nname = "%s"\nrelease = false\n' "$crate" >>"$config"
            fi
          done <<<"$held"

          # Fail on a config that does not say what was intended, rather than
          # hand release-plz something that publishes a held-back crate anyway.
          HELD="$held" python3 - "$config" <<'PY'
          import os, sys, tomllib
          with open(sys.argv[1], "rb") as f:
              cfg = tomllib.load(f)
          held = set(os.environ["HELD"].split())
          off = {p["name"] for p in cfg.get("package", []) if p.get("release") is False}
          if off != held:
              sys.exit(f"generated release-plz config holds back {sorted(off)}, expected {sorted(held)}")
          PY

          held_list=$(paste -sd, - <<<"$held" | sed 's/,/, /g')
          for crate in "${missing[@]}"; do
            echo "::warning title=${crate} is not on crates.io yet::${crate} has never been published, and Trusted Publishing cannot create it. Held back this run: ${held_list}. No tag or GitHub Release until it is bootstrapped. Run \"Publish crate (initial)\" for ${crate} once its dependencies are on crates.io at ${version} with everything it uses (if they lack it, merge the release PR first), then push to main or re-run this job — RELEASING.md, \"Adding a Crate to the Workspace\"."
          done
          {
            echo "### Crates held back from this release"
            echo
            echo "Never published to crates.io: \`${missing[*]}\`. Trusted Publishing cannot create a crate, so it needs the **Publish crate (initial)** workflow first."
            echo
            echo "Held back this run (those crates, everything that depends on them, and the facade \`notedthat\`): \`${held_list}\`. The workspace tag, the GitHub Release and the release.yml dispatch wait until they are all on crates.io."
            echo
            echo "Next steps: RELEASING.md, *Adding a Crate to the Workspace*."
          } >>"$GITHUB_STEP_SUMMARY"

          # Every publishable crate held back: release-plz would find no
          # package to release and fail with "no public packages found".
          skip=false
          if [ "$(sort -u <<<"$held")" = "$(sort -u <<<"$publishable")" ]; then
            skip=true
            echo "Every publishable crate is held back, so there is nothing to publish; skipping release-plz this run."
            {
              echo
              echo "Every publishable crate is held back, so **release-plz was skipped** this run: nothing to publish, tag or release."
            } >>"$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "config=${config}"
            echo "held-back=$(paste -sd' ' - <<<"$held")"
            echo "skip=${skip}"
          } >>"$GITHUB_OUTPUT"
      - name: Run release-plz (release)
        id: release-plz
        # Skipped when the pre-flight held back every publishable crate; its
        # `releases` output is then empty, so the dispatch and index-wait steps
        # below are skipped too.
        if: steps.preflight.outputs.skip != 'true'
        uses: release-plz/action@v0.5
        with:
          command: release
          config: ${{ steps.preflight.outputs.config }}
          # Pinned because release-plz.toml's `pr_body` is a copy of this
          # version's default template. Re-sync that copy when bumping.
          version: 0.3.169
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # release-plz just pushed the workspace tag (e.g. v0.1.4) using
      # GITHUB_TOKEN. GitHub suppresses `push` triggers on tags created that
      # way (recursion prevention), so release.yml would never fire and no
      # binaries, docker image, cosign sigs, or attestations would be built.
      # workflow_dispatch IS allowed to be triggered by GITHUB_TOKEN — so we
      # chain to release.yml explicitly. The `..|.tag?` jq walker handles
      # either shape release-plz may emit (`{"releases":[...]}` or `[...]`),
      # and the `^v[0-9]` filter picks the workspace-wide tag (`v0.1.4`)
      # while skipping per-crate tags (`notedthat-mcp-v0.1.4`).
      - name: Trigger release.yml for the workspace tag
        if: steps.release-plz.outputs.releases != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag=$(printf '%s' "$RELEASES" | jq -r '..|.tag? // empty | select(test("^v[0-9]"))' | head -n1)
          if [ -n "$tag" ] && [ "$tag" != "null" ]; then
            echo "Dispatching release.yml against tag $tag"
            gh workflow run release.yml --ref "$tag" --repo "$GITHUB_REPOSITORY"
          else
            echo "No workspace tag (v*) in release-plz output; nothing to dispatch"
          fi

      # release-plz-pr `needs:` this job and re-queries crates.io to derive the
      # next version. A publish that has returned but is not yet in the sparse
      # index looks identical to "nothing was released", so the PR job would
      # re-propose the version just published and write a duplicate CHANGELOG
      # entry. Hold this job open until the index agrees.
      #
      # The crate list and version come from the checked-in workspace manifests
      # via `cargo metadata`, not from release-plz's output, so this does not
      # depend on that tool's JSON shape. Index paths are the standard sparse
      # layout: <first-2>/<next-2>/<name> for names of four characters or more.
      - name: Wait for crates.io to index the published version
        if: steps.release-plz.outputs.releases != ''
        timeout-minutes: 10
        env:
          # Crates the preflight step held back were not published this run;
          # waiting for them would only run into the timeout.
          HELD_BACK: ${{ steps.preflight.outputs.held-back }}
        run: |
          set -euo pipefail
          meta=$(cargo metadata --no-deps --format-version 1)
          version=$(printf '%s' "$meta" \
            | jq -er '[.packages[] | select(.publish != []) | .version] | unique | .[0]')
          crates=$(printf '%s' "$meta" \
            | jq -er --arg held "$HELD_BACK" \
                '($held | split(" ")) as $h | .packages[] | select(.publish != []) | .name | select(IN($h[]) | not)')
          echo "Waiting for $version to appear in the crates.io index"
          # Read line by line rather than iterating an unquoted variable: crate
          # names are newline-separated, and relying on IFS word-splitting here
          # silently degrades to one garbage URL if the shell does not split.
          while read -r crate; do
            [ -n "$crate" ] || continue
            url="https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}"
            until curl -sfL "$url" \
              | jq -es --arg v "$version" 'any(.[]; .vers == $v)' >/dev/null; do
              echo "  $crate $version not indexed yet; retrying in 5s"
              sleep 5
            done
            echo "  $crate $version indexed"
          done <<< "$crates"

  release-plz-pr:
    name: Open / update release PR
    needs: [test, clippy, fmt, docker-build, integration-test, release-plz-release]
    # `!cancelled()` is what lets this run after a failed release; without it a
    # failed `needs:` skips the job. The result check keeps the rest of the
    # gate: release-plz-release itself only runs once test, clippy, fmt, docker
    # and the integration suite have passed, so it is `skipped` whenever any of
    # them failed, and this job stays skipped with it.
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository == 'NotedThat/NotedThat'
      && contains(fromJSON('["success", "failure"]'), needs.release-plz-release.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz (release-pr)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          config: release-plz.toml
          # Pinned because release-plz.toml's `pr_body` is a copy of this
          # version's default template. Re-sync that copy when bumping.
          version: 0.3.169
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
