# Warden model profile: DeepSeek V4 Flash on the same third-party
# OpenAI-compatible endpoint as the GPT-OSS lane (pi provider `thirdparty`,
# declared in pi/models.json; route and token come from the
# WARDEN_THIRDPARTY_* secrets, both pointing at our egress proxy).
#
# A second lane on that endpoint, kept narrow: only the two built-in
# skills, because the endpoint rate-limits this model at more than a
# couple of hunks in flight (see the runner note) and eight passes per
# hunk would take hours. Its value is a third model family next to
# MiniMax M3 and GPT-OSS: in the PR #138 bake-off it investigated every
# hunk (up to 16 tool-calling turns) and reported nothing on a PR where the
# other two lanes each posted a false positive it had explicitly considered
# and rejected.
#
version = 1

# --- Shared review settings --------------------------------------------------
# Identical in every profile under .github/warden/. Warden's base/overlay
# layering was dropped on purpose: skills defined in a base file are run
# with the base file's defaults, so a base that sets no model handed the
# built-in skills to whatever model pi picked by default (PR #142 ran them
# on MiniMax in every lane, and on GPT-OSS before that, whatever the
# overlay said). A self-contained profile is what the action and the CLI
# both read the same way. Keep the three in step by hand.

[defaults]
runtime = "pi"
# Severity that counts as "would fail" for the summary. It has no teeth while
# failCheck and requestChanges are off: Warden is advisory only until we have
# seen enough of its findings to trust it as a gate (#131 acceptance criteria).
failOn = "high"
reportOn = "low"
failCheck = false
requestChanges = false
# Not source: build output, hand-run QA notes, and the local code graph cache.
ignorePaths = ["target/**", "docs/manual-qa/**", ".codegraph/**"]

# Second read-only pass that re-checks each candidate finding before it is
# reported, with the auxiliary model below.
[defaults.verification]
enabled = true

# Generated files that would otherwise be chunked and sent to the model.
[[defaults.chunking.filePatterns]]
pattern = "Cargo.lock"
mode = "skip"

[[defaults.chunking.filePatterns]]
pattern = "**/CHANGELOG.md"
mode = "skip"

# --- Models and pacing -------------------------------------------------------

# Two hunks at a time. Four in flight got HTTP 429 on 29 of 80 calls and
# killed every code-review hunk; one at a time was clean but needed 13
# minutes for 32 hunks. The egress proxy does not queue this route (only
# MiniMax), so the limit has to be respected here.
[runner]
concurrency = 2

# DeepSeek V4 Flash is a reasoning model; the endpoint accepted
# `reasoning_effort` without error in the bake-off but surfaced no
# reasoning content, so `high` is a request, not a guarantee.
[defaults.agent]
model = "thirdparty/deepseek-v4-flash-0731"
maxTurns = 30
effort = "high"

# MiniMax M3 as the verifier: a third family looking at DeepSeek's
# findings rather than GPT-OSS, which DeepSeek already verifies, so no
# lane grades its own findings (DeepSeek verifying itself let a misread of
# a diff hunk through on PR #142 at high confidence). It goes through the
# proxy's MiniMax route (the catalogue step writes both routes into every
# lane and the token is the same) and shares the proxy's four MiniMax slots
# with the MiniMax scan lane, which the proxy's queue absorbs. Must be set
# explicitly: left unset it falls back to pi's own default, which is
# Anthropic.
[defaults.auxiliary]
model = "minimax/MiniMax-M3"
effort = "high"

# --- Built-in skills ---------------------------------------------------------
# Every skill is one more pass over every matching hunk, so each one is
# scoped with `paths` to the files it can say something about.

[[skills]]
name = "security-review"
# Server code plus everything that decides what runs with secrets in CI or
# ends up in the shipped image.
paths = ["crates/**/*.rs", ".github/workflows/*.yml", "Dockerfile", "docker/**"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
draft = false

[[skills]]
name = "code-review"
paths = ["crates/**/*.rs", ".github/workflows/*.yml"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
draft = false
