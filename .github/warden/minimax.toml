# Warden model profile: MiniMax M3 on the MiniMax subscription, via MiniMax's
# own Anthropic-compatible endpoint (pi provider `minimax`). Never route MiniMax
# through OpenCode Go — that plan is reserved for the other open models.
#
# Overlay only: skills and triggers live in /warden.toml. Key: WARDEN_MINIMAX_API_KEY.
#
# The auxiliary lane (JSON repair, verification, consolidation) MUST be set
# explicitly: left unset it falls back to pi's own default, which is Anthropic.
#
# This is the cheap lane: it runs only the two built-in skills from
# /warden.toml. The wide lane (every skill) is the third-party profile, which
# has no plan quota. See the runner note below for why.
version = 1

# Two hunks at a time. The MiniMax Token Plan is sized for one interactive
# developer (~3-4 concurrent agents on Plus) and answers anything busier
# with 429 "Token Plan rate limit reached (2062)": five in flight — the
# action's default — tripped Warden's circuit breaker on PR #130 after 65
# of ~350 hunks, and the aborted skills were posted as green "No issues"
# checks. One at a time never tripped it but needed hours on a large PR;
# two keeps clear of the plan's guidance with half the wall time. Must live
# in this overlay: the action prefers the base file's value when both set one.
[runner]
concurrency = 2

[defaults.agent]
model = "minimax/MiniMax-M3"
maxTurns = 30

[defaults.auxiliary]
model = "minimax/MiniMax-M3"
