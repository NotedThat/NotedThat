# Warden model profile: MiniMax M3 on the MiniMax subscription, via MiniMax's
# own Anthropic-compatible API (pi provider `minimax`), reached through our
# egress proxy's Anthropic-style route: pi/models.json points the built-in
# provider at WARDEN_MINIMAX_BASE_URL, and the proxy token is
# WARDEN_MINIMAX_API_KEY. Never route MiniMax through OpenCode Go — that plan
# is reserved for the other open models.
#
# This is the cheap lane: only the two built-in skills. The wide lane (every
# skill) was the GPT-OSS profile, which has no plan quota; it is switched off
# for now — see the header of .github/workflows/warden.yml.
#
version = 1

# --- Shared review settings --------------------------------------------------
# Identical in every profile under .github/warden/. Warden's base/overlay
# layering was dropped on purpose: skills defined in a base file are run
# with the base file's defaults, so a base that sets no model handed the
# built-in skills to whatever model pi picked by default (PR #142 ran them
# on MiniMax in every lane, and on GPT-OSS before that, whatever the
# overlay said). A self-contained profile is what the action and the CLI
# both read the same way. Keep the three in step by hand.

[defaults]
runtime = "pi"
# Severity that counts as "would fail" for the summary. It has no teeth while
# failCheck and requestChanges are off: Warden is advisory only until we have
# seen enough of its findings to trust it as a gate (#131 acceptance criteria).
failOn = "high"
reportOn = "low"
failCheck = false
requestChanges = false
# Not source: build output, hand-run QA notes, and the local code graph cache.
ignorePaths = ["target/**", "docs/manual-qa/**", ".codegraph/**"]

# Second read-only pass that re-checks each candidate finding before it is
# reported, with the auxiliary model below.
[defaults.verification]
enabled = true

# Generated files that would otherwise be chunked and sent to the model.
[[defaults.chunking.filePatterns]]
pattern = "Cargo.lock"
mode = "skip"

[[defaults.chunking.filePatterns]]
pattern = "**/CHANGELOG.md"
mode = "skip"

# --- Models and pacing -------------------------------------------------------

# Four hunks at a time. The MiniMax Token Plan is sized for one interactive
# developer (~3-4 concurrent agents on Plus) and answers anything busier
# with 429 "Token Plan rate limit reached (2062)": five in flight — the
# action's default — tripped Warden's circuit breaker on PR #130 after 65
# of ~350 hunks, and the aborted skills were posted as green "No issues"
# checks. Four is the plan's ceiling, and it is safe only because every
# call goes through the egress proxy, which holds a global limit of four
# in flight for MiniMax and queues the rest (FIFO, 429 with Retry-After
# after 120 s): two PRs reviewed at once wait on each other instead of
# tripping the plan. Without the proxy this would have to drop back to two.
[runner]
concurrency = 4

[defaults.agent]
model = "minimax/MiniMax-M3"
maxTurns = 30

# The auxiliary lane (JSON repair, verification, consolidation) is DeepSeek
# V4 Flash on the third-party endpoint, not MiniMax: on PR #138 MiniMax
# posted a finding that misread `futures::stream::buffered` as unordered
# and its own verification pass agreed with it, while DeepSeek checked and
# rejected exactly that claim. The workflow exports both providers' secrets
# into every lane for this. Must be set explicitly: left unset it falls
# back to pi's own default, which is Anthropic.
[defaults.auxiliary]
model = "thirdparty/deepseek-v4-flash-0731"
effort = "high"

# --- Built-in skills ---------------------------------------------------------
# Every skill is one more pass over every matching hunk, so each one is
# scoped with `paths` to the files it can say something about.

[[skills]]
name = "security-review"
# Server code plus everything that decides what runs with secrets in CI or
# ends up in the shipped image.
paths = ["crates/**/*.rs", ".github/workflows/*.yml", "Dockerfile", "docker/**"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
draft = false

[[skills]]
name = "code-review"
paths = ["crates/**/*.rs", ".github/workflows/*.yml"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
draft = false
