# Warden model profile: MiniMax M3 on the MiniMax subscription, via MiniMax's
# own Anthropic-compatible API (pi provider `minimax`), reached through our
# egress proxy's Anthropic-style route: pi/models.json points the built-in
# provider at WARDEN_MINIMAX_BASE_URL, and the proxy token is
# WARDEN_MINIMAX_API_KEY. Never route MiniMax through OpenCode Go — that plan
# is reserved for the other open models.
#
# Overlay only: skills and triggers live in /warden.toml.
#
# The auxiliary lane (JSON repair, verification, consolidation) MUST be set
# explicitly: left unset it falls back to pi's own default, which is Anthropic.
#
# This is the cheap lane: it runs only the two built-in skills from
# /warden.toml. The wide lane (every skill) is the third-party profile, which
# has no plan quota. See the runner note below for why.
version = 1

# Four hunks at a time. The MiniMax Token Plan is sized for one interactive
# developer (~3-4 concurrent agents on Plus) and answers anything busier
# with 429 "Token Plan rate limit reached (2062)": five in flight — the
# action's default — tripped Warden's circuit breaker on PR #130 after 65
# of ~350 hunks, and the aborted skills were posted as green "No issues"
# checks. Four is the plan's ceiling, and it is safe only because every
# call goes through the egress proxy, which holds a global limit of four
# in flight for MiniMax and queues the rest (FIFO, 429 with Retry-After
# after 120 s): two PRs reviewed at once wait on each other instead of
# tripping the plan. Without the proxy this would have to drop back to
# two. Must live in this overlay: the action prefers the base file's value
# when both set one.
[runner]
concurrency = 4

[defaults.agent]
model = "minimax/MiniMax-M3"
maxTurns = 30

# The auxiliary lane (JSON repair, verification, consolidation) is DeepSeek
# V4 Flash on the third-party endpoint, not MiniMax: on PR #138 MiniMax
# posted a finding that misread `futures::stream::buffered` as unordered
# and its own verification pass agreed with it, while DeepSeek checked and
# rejected exactly that claim. The workflow exports the third-party
# secrets into every lane for this. Must be set explicitly: left unset it
# falls back to pi's own default, which is Anthropic.
[defaults.auxiliary]
model = "thirdparty/deepseek-v4-flash-0731"
effort = "high"
