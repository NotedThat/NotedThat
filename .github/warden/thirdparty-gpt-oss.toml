# Warden model profile: GPT-OSS 120B on a third-party OpenAI-compatible
# endpoint (pi provider `thirdparty`, declared in pi/models.json; route and
# token come from the WARDEN_THIRDPARTY_* secrets, both pointing at our
# egress proxy).
#
# The wide lane: the two built-in skills plus six more — Sentry's
# generalised review skills and two community ones — because this endpoint
# has no plan quota, so eight passes per hunk cost nothing, and a second
# model family next to MiniMax M3 is the point.
#
version = 1

# --- Shared review settings --------------------------------------------------
# Identical in every profile under .github/warden/. Warden's base/overlay
# layering was dropped on purpose: skills defined in a base file are run
# with the base file's defaults, so a base that sets no model handed the
# built-in skills to whatever model pi picked by default (PR #142 ran them
# on MiniMax in every lane, and on GPT-OSS before that, whatever the
# overlay said). A self-contained profile is what the action and the CLI
# both read the same way. Keep the three in step by hand.

[defaults]
runtime = "pi"
# Severity that counts as "would fail" for the summary. It has no teeth while
# failCheck and requestChanges are off: Warden is advisory only until we have
# seen enough of its findings to trust it as a gate (#131 acceptance criteria).
failOn = "high"
reportOn = "low"
failCheck = false
requestChanges = false
# Not source: build output, hand-run QA notes, and the local code graph cache.
ignorePaths = ["target/**", "docs/manual-qa/**", ".codegraph/**"]

# Second read-only pass that re-checks each candidate finding before it is
# reported, with the auxiliary model below.
[defaults.verification]
enabled = true

# Generated files that would otherwise be chunked and sent to the model.
[[defaults.chunking.filePatterns]]
pattern = "Cargo.lock"
mode = "skip"

[[defaults.chunking.filePatterns]]
pattern = "**/CHANGELOG.md"
mode = "skip"

# --- Models and pacing -------------------------------------------------------

# No plan quota on this endpoint, and 78 tool calls in 26 s at five in
# flight showed no strain; eight is the next step, twelve if a large PR
# passes without 429s.
[runner]
concurrency = 8

# GPT-OSS is a reasoning model and was running with reasoning off: on PR
# #133 and #130 it posted confident findings about GitHub Actions and Rust
# syntax that a moment's thought refutes, and its verification pass (the
# same model, same setting) let them through. `high` is the ceiling the
# endpoint accepts (low|medium|high).
[defaults.agent]
model = "thirdparty/openai/gpt-oss-120b"
maxTurns = 30
effort = "high"

# The auxiliary lane (JSON repair, verification, consolidation) is DeepSeek
# V4 Flash, not GPT-OSS: a model grading its own findings shares its blind
# spots, and on PR #138 DeepSeek was the one model that considered and
# correctly rejected what the other two posted. Same endpoint and secrets
# as the agent lane. Warden verifies four findings at a time, and the
# endpoint rate-limits DeepSeek at more than two in flight; a verification
# call that fails keeps the finding unverified (today's behaviour), so a
# 429 here degrades gracefully rather than losing a finding. Must be set
# explicitly: left unset it falls back to pi's own default, which is
# Anthropic.
[defaults.auxiliary]
model = "thirdparty/deepseek-v4-flash-0731"
effort = "high"

# --- Built-in skills ---------------------------------------------------------
# Every skill is one more pass over every matching hunk, so each one is
# scoped with `paths` to the files it can say something about.

[[skills]]
name = "security-review"
# Server code plus everything that decides what runs with secrets in CI or
# ends up in the shipped image.
paths = ["crates/**/*.rs", ".github/workflows/*.yml", "Dockerfile", "docker/**"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
draft = false

[[skills]]
name = "code-review"
paths = ["crates/**/*.rs", ".github/workflows/*.yml"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
draft = false

# --- Sentry's generalised review skills (getsentry/warden-skills, MIT) -------
# Skill sources: remote pinned to a commit (`remote = "owner/repo@sha"`) —
# bump the sha deliberately, never float — or repo-local under
# .agents/skills/ for a vendored skill Warden's remote loader cannot reach.
# Pinned to one commit; update all four together.

[[skills]]
name = "wrdn-authz"
remote = "getsentry/warden-skills@daf01f970a28450627a8d2d61d9915a742a735e2"
# Everything that decides who may do what: manifest rules, principals, the
# per-surface gates, and the MCP wrapper that inherits them.
paths = ["crates/**/*.rs"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
draft = false

[[skills]]
name = "wrdn-dos-review"
remote = "getsentry/warden-skills@daf01f970a28450627a8d2d61d9915a742a735e2"
# Unbounded work reachable from a request: Range/lines parsing, listing caps,
# patch size caps, JWKS refetch, watcher queues.
paths = ["crates/**/*.rs"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
draft = false

[[skills]]
name = "wrdn-data-exfil"
remote = "getsentry/warden-skills@daf01f970a28450627a8d2d61d9915a742a735e2"
# Untrusted input reaching a sink that leaks beyond its scope: object keys
# as paths, the browse surface, OIDC discovery fetches, error bodies.
paths = ["crates/**/*.rs"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
draft = false

[[skills]]
name = "wrdn-gha-workflows"
remote = "getsentry/warden-skills@daf01f970a28450627a8d2d61d9915a742a735e2"
# Workflows publish crates and signed images; pwn-requests, expression
# injection and unpinned actions are the failure modes that matter here.
paths = [".github/workflows/*.yml", ".github/actions/**"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
draft = false

# --- Community skills -------------------------------------------------------

[[skills]]
name = "mattpocock-code-review"
# Two axes the bug-only skills deliberately leave out: documented standards
# (DEVELOPMENT.md, CONFIGURATION.md, design principles) and conformance to the
# spec (SPECIFICATIONS.md decisions, the PR description).
paths = ["crates/**/*.rs", "docs/**/*.md", "SPECIFICATIONS.md"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
draft = false

[[skills]]
name = "caveman-review"
remote = "JuliusBrussee/caveman@15581d14007fd01fb3f132016741962f34936ca2"
# General review in one line per finding: bug / risk / nit / question.
# (JuliusBrussee/caveman, MIT for the skills/ tree.) Remote rather than
# vendored because Warden finds it in the repo's flat skills/ directory —
# unlike mattpocock/skills, whose nested skills/engineering/ layout it does
# not search, hence the vendored copy above.
paths = ["crates/**/*.rs"]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]
draft = false
