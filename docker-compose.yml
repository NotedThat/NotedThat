# Local dev + example stack for NotedThat.
#
#   docker compose up --build          # build & run the whole stack
#   docker compose logs -f notedthat-server
#   docker compose down                # stop (keeps data)
#   docker compose down -v             # stop and wipe SeaweedFS/Qdrant volumes
#
# Ports are bound to 127.0.0.1 so nothing is exposed to the LAN by default.
# Override anything below by copying .env.example to .env and editing values.

name: notedthat

services:

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: notedthat-qdrant
    ports:
      - "127.0.0.1:6333:6333"   # HTTP
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    # No custom healthcheck: qdrant/qdrant ships a scratch-style rootfs with
    # no shell, so `CMD-SHELL` probes can't run inside it. `depends_on` below
    # uses `service_started` for this reason.
    restart: unless-stopped

  notedthat-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: notedthat-server:local
    container_name: notedthat-server
    ports:
      - "127.0.0.1:${NOTEDTHAT_HTTP_PORT:-8080}:8080"
    environment:
      NOTEDTHAT_API_TOKEN: ${NOTEDTHAT_API_TOKEN:-dev-token-please-change}
      NOTEDTHAT_KBS: ${NOTEDTHAT_KBS:-notes,scratch}
      NOTEDTHAT_LISTEN_ADDR: 0.0.0.0:8080
      # Objects on disk, in the notedthat-data volume. Add docker-compose.s3.yml to
      # run against SeaweedFS instead; the two backends' variables cannot both be set.
      NOTEDTHAT_STORAGE_BACKEND: fs
      NOTEDTHAT_FS_ROOT: /var/lib/notedthat
      NOTEDTHAT_LOG_FORMAT: ${NOTEDTHAT_LOG_FORMAT:-pretty}
      RUST_LOG: ${RUST_LOG:-info,notedthat=debug}
      NOTEDTHAT_WEBDAV_USERNAME: ${NOTEDTHAT_WEBDAV_USERNAME:-webdav-user-please-change}
      NOTEDTHAT_WEBDAV_PASSWORD: ${NOTEDTHAT_WEBDAV_PASSWORD:-webdav-pass-please-change}
      NOTEDTHAT_MCP_HTTP_ALLOWED_HOSTS: ${NOTEDTHAT_MCP_HTTP_ALLOWED_HOSTS-}
      NOTEDTHAT_MCP_HTTP_ALLOWED_ORIGINS: ${NOTEDTHAT_MCP_HTTP_ALLOWED_ORIGINS-}
      NOTEDTHAT_QDRANT_URL: http://qdrant:6334
      NOTEDTHAT_MAX_PATCHABLE_SIZE: ${NOTEDTHAT_MAX_PATCHABLE_SIZE:-104857600}
      NOTEDTHAT_QDRANT_TIMEOUT_MS: ${NOTEDTHAT_QDRANT_TIMEOUT_MS:-30000}
      NOTEDTHAT_QDRANT_CONNECT_TIMEOUT_MS: ${NOTEDTHAT_QDRANT_CONNECT_TIMEOUT_MS:-10000}
      EMBEDDING_ENDPOINT_URL: ${EMBEDDING_ENDPOINT_URL:?set in .env — see docs/CONFIGURATION.md}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set in .env — see docs/CONFIGURATION.md}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?set in .env — see docs/CONFIGURATION.md}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:?set in .env — see docs/CONFIGURATION.md}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-30000}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-3}
      EMBEDDING_MAX_INPUT_TOKENS: ${EMBEDDING_MAX_INPUT_TOKENS:-8192}
    volumes:
      - notedthat-data:/var/lib/notedthat
    depends_on:
      qdrant:
        condition: service_started
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  notedthat-data:
  qdrant-data:
